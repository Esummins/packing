name = "PackingCert"
version = "0.1.0"
defaultTargets = ["PackingCert"]

[[lean_lib]]
name = "PackingCert"
precompileModules = true   # native_decide then calls compiled code (faster on the big measure theorem)

# Slow target (minutes): `lake build PackingCertSlow`
[[lean_lib]]
name = "PackingCertSlow"
roots = ["PackingCertSlow"]

[[lean_exe]]
name = "measure_bench"
root = "MeasureBench"
