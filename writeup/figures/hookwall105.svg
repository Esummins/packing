<text x="1154.0" y="568.0" font-size="9" fill="#333" text-anchor="start">the equal-tilt FOUR-HOOK SHELL (the grid tilted by 18.93 deg): four wall uprights stacked in pairs on the side walls,</text>
<text x="1154.0" y="580.0" font-size="9" fill="#333" text-anchor="start">four floor/ceiling squares carrying their inner corners, neighbours touching vertex-to-vertex along each wall.</text>
<text x="1154.0" y="592.0" font-size="9" fill="#333" text-anchor="start">Its side is EXACTLY m = 2(1+sin t)(1+cos t)/(sin t + cos t) = 4.057526 &gt;= 4 (Theorem HOOK-4), so the nicks are</text>
<text x="1154.0" y="604.0" font-size="9" fill="#333" text-anchor="start">eps = (4 - m)/2 = -0.0288 &lt; 0: every corner box is met by ONE square -- the shell is never K0-BLOCKED; at t -&gt; 0 it is the 4x4 grid.</text>
<text x="1154.0" y="616.0" font-size="9" fill="#333" text-anchor="start">checks: containment 0.0e+00, min pairwise SAT -2.2e-16; corner meeters BL:1 BR:1 TR:1 TL:1.</text>
