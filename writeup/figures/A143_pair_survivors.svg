<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2180" viewBox="0 0 1500 2180"><rect width="1500" height="2180" fill="#fff"/><text x="16.0" y="26.0" font-family="DejaVu Sans,Arial" font-size="14" fill="#111" font-weight="bold">A143 — surviving level-1 PAIR cells of the doubly-met corner-first root</text><text x="16.0" y="44.0" font-family="DejaVu Sans,Arial" font-size="10" fill="#111">Each panel: the container [0, s0]^2 (thin dashed), the widened BL box [0, 1.02551]^2 (dashed orange), and the two conditioned squares H1, H2 drawn at their clipped boxes' centres.</text><text x="16.0" y="60.0" font-family="DejaVu Sans,Arial" font-size="10" fill="#111">THREE cores inside each H, exactly as A140 draws them: SOLID BLACK = the stock axis core K(a) = caselp.Box.core() that the LP prunes against; DASHED BLACK = A135's certified EXACT axis core (same pose, larger a — inside the FROZEN certificate schema);</text><text x="16.0" y="76.0" font-family="DejaVu Sans,Arial" font-size="10" fill="#111">PURPLE FILL = A132's certified polygon core K'(B) = the intersection of Q(c,θ) over the whole box (NOT in the frozen schema — a kill that needs it is 'LP-dead, certificate pending').</text><text x="16.0" y="92.0" font-family="DejaVu Sans,Arial" font-size="10" fill="#111">Thin dashed grey outlines are schematic: the square at the box's two extremal tilts, drawn to show how much pose freedom the cell still carries.  The first panel is the TRUMP pair cell (the canary): Trump's own BL 2-crowd at its single non-simple corner, after the D4 reduction.</text><text x="60.0" y="138.0" font-family="DejaVu Sans,Arial" font-size="11" fill="#111" font-weight="bold">pair cell (0, 4, 0) x (5, 0, 3)</text><rect x="60.00" y="146.00" width="0.00" height="0.00" fill="none" fill-opacity="1.0" stroke="#333" stroke-width="0.6"/><rect x="60.00" y="150.00" width="356.69" height="356.69" fill="none" fill-opacity="1.0" stroke="#90a4ae" stroke-width="0.8" stroke-dasharray="5,4"/><rect x="60.00" y="412.3