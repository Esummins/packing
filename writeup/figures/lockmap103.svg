<text x="30.0" y="681.0" font-size="9.5" fill="#444" text-anchor="start">blue = intruder HELD at first order (Lemma ROT + Cor. 2: its contact rows balance the virtual corner push; no strictly opening, depth-decreasing single-square motion);</text>
<text x="30.0" y="695.0" font-size="9.5" fill="#444" text-anchor="start">red = UNHELD (the LP direction is drawn: arrow = translation part, "rot" = rotation sense); grey = free squares. Contacts at gap &lt; 1e-7, meet bar 1e-9 (A102 conventions).</text>
<text x="30.0" y="709.0" font-size="9.5" fill="#444" text-anchor="start">A103 (2026-09-06): no K0-BLOCKED packing on disk (12/12, sides 3.985-4.107) is held at all eight intruders; every one has an unheld SECOND meeter. Trump: 5/5 held (canary).</text>
<text x="30.0" y="723.0" font-size="9.5" fill="#444" text-anchor="start">The (C) object is therefore not a realised frame but the family RES-LOCK (all intruders held, side &lt; 4), empty on the corpus; the fact that would finish is Conjecture LOCK-FREE (noroom.md s.7).</text>
