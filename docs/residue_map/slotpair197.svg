<text x="40.0" y="50.0" font-size="10" fill="#555" text-anchor="start">docs/proofs/forced_corners.md Theorem FC + Corollaries FC-slot / FC-count; sideband.md Lemma A1; A171 multibox at nsub 8 / refine 4.  Hatched = an admissible region the clip empties.</text>
