<text x="40.0" y="697.6" font-size="9" fill="#333" text-anchor="start">WHAT THIS IS: the two meeters Theorem FC demands at BL(1,0), EXHIBITED.</text>
<text x="40.0" y="711.6" font-size="9" fill="#333" text-anchor="start">So the cell is not the contradiction it was read as -- the page survives the pair test.</text>
