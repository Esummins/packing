<text x="40.0" y="40.0" font-size="9.5" fill="#333" text-anchor="start">Theorem FC: two DISTINCT non-pin squares must meet the widened open slot box B+ (orange).  The library proves there is no such pair.</text>
<text x="40.0" y="54.0" font-size="9.5" fill="#333" text-anchor="start">(one-free) NOT EVEN ONE free square can meet B+: EmptyBox(B_TL00) -- so the two Theorem FC demands certainly do not exist.   1.83 s</text>
