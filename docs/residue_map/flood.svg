<svg xmlns="http://www.w3.org/2000/svg" width="464.0" height="396" font-family="Segoe UI, sans-serif" style="background:#fff">
<text x="40" y="30" font-size="13" fill="#222" text-anchor="start" font-weight="bold">The Young flood from a corner: cells placed (blue), completable cells (dashed), intruders removed (red outline)</text>
<line x1="40" y1="330" x2="424.0" y2="330" stroke="#000" stroke-width="3"/>
<line x1="40" y1="330" x2="40" y2="18.0" stroke="#000" stroke-width="3"/>
<rect x="40" y="210" width="120" height="120" fill="#90caf9" fill-opacity="0.6" stroke="#1565c0" stroke-width="1.5"/>
<rect x="160" y="210" width="120" height="120" fill="#90caf9" fill-opacity="0.6" stroke="#1565c0" stroke-width="1.5"/>
<rect x="40" y="90" width="120" height="120" fill="#90caf9" fill-opacity="0.6" stroke="#1565c0" stroke-width="1.5"/>
<rect x="280" y="210" width="120" height="120" fill="none" stroke="#444" stroke-width="1.2" stroke-dasharray="5,3"/>
<rect x="160" y="90" width="120" height="120" fill="none" stroke="#444" stroke-width="1.2" stroke-dasharray="5,3"/>
<rect x="40" y="-30" width="120" height="120" fill="none" stroke="#444" stroke-width="1.2" stroke-dasharray="5,3"/>
<polygon points="286.0,306.0 394.8,255.3 344.0,146.5 235.3,197.2" fill="none" fill-opacity="0.55" stroke="#c62828" stroke-width="2"/>
<polygon points="172.0,192.0 240.8,93.7 142.5,24.9 73.7,123.2" fill="none" fill-opacity="0.55" stroke="#c62828" stroke-width="2"/>
<text x="40" y="350" font-size="11" fill="#222" text-anchor="start">X(D) = (#squares meeting D) - |D| = overhang minus free area inside D.  K0-BLOCKED &lt;=&gt; X(slot) &gt;= 1.  Win when X(D) &lt;= 0.</text>
<text x="40" y="366" font-size="11" fill="#222" text-anchor="start">Below side 4 every square meets the 3x3 block, so X(3x3) = 2 exactly: a win needs &lt;= 8 cells (Lemma CAP). Trump: X = 1 for every diagram; deficit 2.</text>
<text x="40" y="382" font-size="11" fill="#222" text-anchor="start">Measured: 30/33 corners convert (depth &lt;= 3); stalls = interlocks. A free cell pays the deficit down; a doubly-intruded cell raises it.</text>
</svg>