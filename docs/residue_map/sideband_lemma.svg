<text x="340.0" y="380.0" font-size="10" font-weight="bold">2a. [F] "within 1 of a wall" at the WIDENED box: two 45-deg diamonds, SAT gap 0.0078,</text>
<text x="340.0" y="394.0" font-size="10" >both meet (0, 1+w)^2 (neither meets the unit box), both centres > 1 in x and y.</text>
