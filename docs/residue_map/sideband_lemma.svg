<text x="480.0" y="460.0" font-size="10" font-weight="bold">2b. [F] "the other lies outside the band":</text>
<text x="480.0" y="474.0" font-size="10" >Q1 = [0.1,1.1]x[0,1] and Q2 at tilt 2.87 deg,</text>
<text x="480.0" y="488.0" font-size="10" >centre (0.524, 1.522), gap 1e-04:</text>
<text x="480.0" y="502.0" font-size="10" >both meet (0,1)^2, both centres have x < 1.</text>
<text x="480.0" y="516.0" font-size="10" >Cells SW and NW -- the cell form holds.</text>
<text x="480.0" y="540.0" font-size="10" >Sharpness of c: the diamonds at (c-e, c+1/sqrt2-e') and</text>
<text x="480.0" y="554.0" font-size="10" >(c+1/sqrt2-e', c-e), e < e', are disjoint meeters with both</text>
<text x="480.0" y="568.0" font-size="10" >centres > c - e, so no band narrower than c works.</text>
