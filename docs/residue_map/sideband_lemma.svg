<text x="20.0" y="380.0" font-size="10" font-weight="bold">1. Lemma A2 (cells): two disjoint meeters of (0,c)^2 sit in DIFFERENT cells of</text>
<text x="20.0" y="394.0" font-size="10" >{x<c, x>=c} x {y<c, y>=c}, because centres are >= 1/sqrt2 apart in l-inf (Lemma A1) and</text>
<text x="20.0" y="408.0" font-size="10" >each cell of M has l-inf diameter < 1/sqrt2 when c < 1/2 + 1/sqrt2 = 1.207.  Never {NE, NE}:</text>
<text x="20.0" y="422.0" font-size="10" >that is SIDEBAND (a) with its sharp constant c (Lean not_both_ne; no quadrant, any c).</text>
<text x="20.0" y="436.0" font-size="10" >Shown: c = 1 + w = 1.0255, the pair {NW, SE} ("one up the wall, one along the floor").</text>
