<text x="20.0" y="22.0" font-size="14" font-weight="bold">The sideband lemma (A169, docs/proofs/sideband.md): the sharp constant is c itself, and what is true is the CELL form</text>
<text x="20.0" y="40.0" font-size="10" fill="#444">blue = corner box (0,c)^2; dashed = the lines x = c, y = c; cyan = first meeter Q1; green = second meeter Q2; dots = centres; grey = the meeter-centre set M = [1/2, c+1/sqrt2)^2 cut by the quarter-disc at (c,c).</text>
