<text x="660.0" y="380.0" font-size="10" font-weight="bold">3. The slide construction (Cor. B2): Q1 on the floor at tilt theta, slid delta; the deepest</text>
<text x="660.0" y="394.0" font-size="10" >mode-(a) partner rests on Q1's upper-left edge with its left vertex on the wall; its lowest</text>
<text x="660.0" y="408.0" font-size="10" >point is at height sec(theta) - delta tan(theta) < 1 iff delta > tan(theta/2) = t,</text>
<text x="660.0" y="422.0" font-size="10" >intrusion (delta - t) tan(theta) = 2t(delta - t)/(1 - t^2).  Pressed (delta = 0): lonely at</text>
<text x="660.0" y="436.0" font-size="10" >every tilt for the unit box (Cor. B1).</text>
