<text x="1263.1" y="235.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="9" fill="#444" text-anchor="start">WHAT THIS IS: A169 Theorem B (sideband.md sec 3,</text>
<text x="1263.1" y="247.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="9" fill="#444" text-anchor="start">row R3 sec 6) says a corner meeter pose with no</text>
<text x="1263.1" y="259.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="9" fill="#444" text-anchor="start">possible SECOND meeter of the widened corner box</text>
<text x="1263.1" y="271.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="9" fill="#444" text-anchor="start">cannot occur in a K0-BLOCKED packing.  A168 used</text>
<text x="1263.1" y="283.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="9" fill="#444" text-anchor="start">it only to kill a role all of whose poses are</text>
<text x="1263.1" y="295.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="9" fill="#444" text-anchor="start">lonely.  Here it CLIPS: every centre slab and tilt</text>
<text x="1263.1" y="307.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="9" fill="#444" text-anchor="start">sub-bin certified lonely is removed, K'(D) is</text>
<text x="1263.1" y="319.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="9" fill="#444" text-anchor="start">rebuilt from the survivors (larger), and the</text>
<text x="1263.1" y="331.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="9" fill="#444" text-anchor="start">cascade carries that into H.</text>
<text x="1263.1" y="343.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="9" fill="#444" text-anchor="start"></text>
<text x="1263.1" y="355.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="9" fill="#444" text-anchor="start">SOUNDNESS: the box test is a SUFFICIENT condition</text>
