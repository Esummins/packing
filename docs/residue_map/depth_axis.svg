<text x="82" y="172" font-size="11" fill="#222" text-anchor="start">nick shell: d2 &lt; s-hat - m; SLIDE forbids below side s-hat - d2; pin slack covers d2 &lt; 0.02 (k1 tree)</text>
<rect x="60" y="180" width="14" height="14" fill="#ef9a9a"/>
<text x="82" y="192" font-size="11" fill="#222" text-anchor="start">THE RESIDUE (middle band): no certificate; crowd LP refused &lt;= 0.1, failed certification at 0.2</text>
<rect x="60" y="200" width="14" height="14" fill="#c8e6c9"/>
<text x="82" y="212" font-size="11" fill="#222" text-anchor="start">impossible: CEIL — two intruders cannot both exceed 1 - 1/sqrt2 = 0.2929</text>
<text x="60" y="240" font-size="11" fill="#222" text-anchor="start">Census of the 7,044 realisable pairs: 56% cannot host d2 &gt;= 0.05, 82% cannot host d2 &gt;= 0.1, 91% cannot host d2 &gt;= 0.2; 1.2% can host both &gt;= 0.3.</text>
<text x="60" y="258" font-size="11" fill="#222" text-anchor="start">Lowest known K0-BLOCKED packing: 3.985 (nicked TL/TR, substantive BL/BR). The middle band is where the tree spends its time.</text>
