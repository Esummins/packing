<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="480" font-family="Segoe UI, sans-serif" style="background:#fff">
<text x="30" y="64.0" font-size="13" fill="#222" text-anchor="start" font-weight="bold">1. JAM (68 of 7,044 pairs)</text>
<line x1="30" y1="370" x2="318.0" y2="370" stroke="#000" stroke-width="3"/>
<line x1="30" y1="370" x2="30" y2="82.0" stroke="#000" stroke-width="3"/>
<rect x="30" y="250" width="120" height="120" fill="none" stroke="#444" stroke-width="1.2" stroke-dasharray="4,3"/>
<rect x="30" y="250" width="14.399999999999999" height="120" fill="#fdd835" fill-opacity="0.45"/>
<polygon points="44.4,370.0 164.4,370.0 164.4,250.0 44.4,250.0" fill="#ef9a9a" fill-opacity="0.55" stroke="#c62828" stroke-width="1.6"/>
<polygon points="39.0,250.3 158.7,242.0 150.3,122.3 30.6,130.6" fill="#90caf9" fill-opacity="0.55" stroke="#1565c0" stroke-width="1.6"/>
<text x="30" y="386" font-size="10.5" fill="#222" text-anchor="start">slot square parked g = 0.12 off the slot; partner nicks</text>
<text x="30" y="400" font-size="10.5" fill="#222" text-anchor="start">the sliver: tilt <= arcsin g, depth ~ g^2/4 = 0.003</text>
<text x="30" y="414" font-size="10.5" fill="#222" text-anchor="start">area-free; needs a floating pusher (FLOAT: strands</text>
<text x="30" y="428" font-size="10.5" fill="#222" text-anchor="start">0.707) or an on-wall pusher (WALL-F: 2 flush widths).</text>
<text x="30" y="442" font-size="10.5" fill="#222" text-anchor="start">Lives only within 0.01 of s-hat (SLIDE).</text>
<text x="360" y="64.0" font-size="13" fill="#222" text-anchor="start" font-weight="bold">2. BLOCK (same grain, edge-to-edge)</text>
<line x1="360" y1="370" x2="648.0" y2="370" stroke="#000" stroke-width="3"/>
<line x1="360" y1="370" x2="360" y2="82.0" stroke="#000" stroke-width="3"/>
<rect x="360" y="250" width="120" height="120" fill="none" stroke="#444" stroke-width="1.2" stroke-dasharray="4,3"/>
<polygon points="444.0,370.0 556.8,329.0 515.7,216.2 403.0,257.2" fill="#ef9a9a" fill-opacity="0.55" stroke="#c62828" stroke-width="1.6"/>
<polygon points="403.0,257.2 515.7,216.2 474.7,103.4 361.9,144.5" fill="#90caf9" fill-opacity="0.55" stroke="#1565c0" stroke-width="1.6"/>
<text x="360" y="386" font-size="10.5" fill="#222" text-anchor="start">both at 30 deg sharing an edge; depths 0.49 / 0.06</text>
<text x="360" y="400" font-size="10.5" fill="#222" text-anchor="start">a 2x1 tilted block against the corner; charge can be</text>
<text x="360" y="414" font-size="10.5" fill="#222" text-anchor="start">exactly 0 (certified) — the free object of the</text>
<text x="360" y="428" font-size="10.5" fill="#222" text-anchor="start">area budget. At 45 deg it is the CEIL pair.</text>
<text x="690" y="64.0" font-size="13" fill="#222" text-anchor="start" font-weight="bold">3. WEDGE (both tilted, 15-45 deg)</text>
<line x1="690" y1="370" x2="978.0" y2="370" stroke="#000" stroke-width="3"/>
<line x1="690" y1="370" x2="690" y2="82.0" stroke="#000" stroke-width="3"/>
<rect x="690" y="250" width="120" height="120" fill="none" stroke="#444" stroke-width="1.2" stroke-dasharray="4,3"/>
<polygon points="690.0,370.0 859.7,370.0 690.0,200.3" fill="#fdd835" fill-opacity="0.35" stroke="#7a5c00" stroke-width="1.6"/>
<polygon points="859.7,370.0 944.6,285.1 859.7,200.3 774.9,285.1" fill="#ef9a9a" fill-opacity="0.55" stroke="#c62828" stroke-width="1.6"/>
<polygon points="690.0,170.3 774.9,255.1 859.7,170.3 774.9,85.4" fill="#90caf9" fill-opacity="0.55" stroke="#1565c0" stroke-width="1.6"/>
<text x="690" y="386" font-size="10.5" fill="#222" text-anchor="start">depths 0.293 / 0.043; a line through the corner</text>
<text x="690" y="400" font-size="10.5" fill="#222" text-anchor="start">separates them (CEIL: shallower one <= 0.293).</text>
<text x="690" y="414" font-size="10.5" fill="#222" text-anchor="start">Stranded triangle <= 1. THE MIDDLE BAND: second</text>
<text x="690" y="428" font-size="10.5" fill="#222" text-anchor="start">intruder in (0.05, 0.29) — no tool touches it.</text>
<text x="1020" y="64.0" font-size="13" fill="#222" text-anchor="start" font-weight="bold">4. OFFSET-UPRIGHT (Trump's own corner; 28% of pairs)</text>
<line x1="1020" y1="370" x2="1308.0" y2="370" stroke="#000" stroke-width="3"/>
<line x1="1020" y1="370" x2="1020" y2="82.0" stroke="#000" stroke-width="3"/>
<rect x="1020" y="250" width="120" height="120" fill="none" stroke="#444" stroke-width="1.2" stroke-dasharray="4,3"/>
<polygon points="1020.0,268.7 1140.0,268.7 1140.0,148.7 1020.0,148.7" fill="#ef9a9a" fill-opacity="0.55" stroke="#c62828" stroke-width="1.6"/>
<polygon points="1119.8,292.6 1211.5,370.0 1288.9,278.3 1197.2,200.9" fill="#90caf9" fill-opacity="0.55" stroke="#1565c0" stroke-width="1.6"/>
<text x="1020" y="386" font-size="10.5" fill="#222" text-anchor="start">Trump TL in the BL frame: upright flush on the wall,</text>
<text x="1020" y="400" font-size="10.5" fill="#222" text-anchor="start">0.8445 off the slot; partner at 40.18 deg. Depths</text>
<text x="1020" y="414" font-size="10.5" fill="#222" text-anchor="start">0.155 / 0.168. Charge 0.980 — affordable only</text>
<text x="1020" y="428" font-size="10.5" fill="#222" text-anchor="start">because Trump's other three corners charge 0.</text>
</svg>