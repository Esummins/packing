<text x="70" y="398" font-size="10" fill="#444">orange: four free squares at one tilt; blue dashed: three-square core without f3. Above 48.4° f3 is loose (gaps 1e-3 to 1e-1); at and below it f3 is wedged with its two contacts exactly opposite (D = 1.0000).</text>
<text x="70" y="412" font-size="10" fill="#444">f1 touches the top wall at every tilt near the minimum: the binding constraint is f0 and f2 sliding past each other until f1 hits the top, as the PI read it.</text>
