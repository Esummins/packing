<text x="40" y="558.2580472338166" font-size="11" fill="#222" text-anchor="start">Red corners (BL, BR): INTERLOCKED — the exchange and the Young flood both stall (adjacent crowds lock through the 4 - m overlap of their arm cells).</text>
<text x="40" y="574.2580472338166" font-size="11" fill="#222" text-anchor="start">Green corners (TL, TR): convertible — remove the two intruders, place the slot square, re-fit one square at the same side (verified exactly).</text>
<text x="40" y="590.2580472338166" font-size="11" fill="#222" text-anchor="start">Depths: BL: 0.015, 0.227; BR: 0.099, 0.015; TL: 7.0e-09, 1.000; TR: 1.6e-08, 0.406.  TL/TR = near-slot square + 1e-8 nick (ghost); BL/BR substantive.</text>
