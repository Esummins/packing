<text x="10" y="572">IS: the reduced catalogue.  Moves applied to each square against its partner only, repeated to a fixed point: flatten (rotate to the nearest flat pose if the whole sweep is</text>
<text x="10" y="586">collision-free and the square still meets the box), drop straight down to the floor, drop straight left to the wall.  Classes are keyed by the reduced types and senses of both</text>
<text x="10" y="600">squares plus the contact graph {A-floor, A-wall, B-floor, B-wall, A-B}.  Both normalisation orders are kept, so a raw cell can feed two classes.  Squares that reach the flush</text>
<text x="10" y="614">corner pose are simple (k >= 1) and listed once.  Not stratified: tilt magnitude; blockers; which vertex or edge makes each contact.</text>
</svg>