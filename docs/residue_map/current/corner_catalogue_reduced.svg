<svg xmlns="http://www.w3.org/2000/svg" width="738" height="692" font-family="sans-serif" font-size="10">
<text x="10" y="18" font-size="13" font-weight="bold">CORNER MEETER PAIRS, REDUCED: classes that survive the free moves (drop / flatten / slide against the partner), by reduced types, senses and contact graph</text>
<text x="10" y="34">From 30 raw feasible (type, sense) cells; each exemplar normalised against its partner only, in both orders; 16 classes remain.  Dashed red = the corner box.  Contacts listed under each.</text>
<text x="10" y="48">The second layer (blockers X, Y that stop a drop in a real packing) is NOT in this table: a class here is a pair whose drops are stopped by the PARTNER alone or that has already landed.</text>
