<text x="26" y="28" font-size="16" font-family="sans-serif" font-weight="bold">A257 -- the SEAM: the 14 near-Trump siblings of the aligned descent to the tube (pad g1, delta_pin 1e-2)</text>
<text x="26" y="48" font-size="11" font-family="sans-serif" fill="#444">Each panel is ONE aligned cut at the tube wall.  The shaded half is the sibling the ordinary rules must kill; the clear half holds the Trump image and is where the spine descends to TUBE-KILL.</text>
<text x="26" y="64" font-size="11" font-family="sans-serif" fill="#444">Green = the sibling died (rule named).  Red = it did not die inside the wall -- that panel IS the seam gap (delta_LP &lt; delta_basin there).  Grey = not run.</text>
