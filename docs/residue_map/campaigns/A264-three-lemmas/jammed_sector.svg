<text x="440.0" y="320.0" font-size="10" fill="#111">(a) BL corner of the JAM ring jam261_polished|3.8770 (A261 witness installed at s = 3.8771): A, A2 floor row (blue), X wall square (pink), C the</text>
<text x="440.0" y="333.0" font-size="10" fill="#111">    floater (tan; 0.440 off the wall, gap to A 0.0068).  Dashed blue: T_u = C moved to the wall (the comparison obstacle).</text>
<text x="440.0" y="346.0" font-size="10" fill="#111">    Stipple: T_u minus C, the STRIP -- undecided [C]; on 323/323 rings no free square of the BL sectors enters it (cmp264).</text>
<text x="440.0" y="359.0" font-size="10" fill="#111">    Orange: the free square of the BL-floor sector with the largest (q-O).(-v) - 1/2 = -0.6917 &lt; 0 (exact centre sets;</text>
<text x="440.0" y="372.0" font-size="10" fill="#111">    free_margin 0.0e+00).  Its obstacles are A and C only: X and A2 never touch a sector square (sub264, 323 rings).</text>
<text x="440.0" y="385.0" font-size="10" fill="#111">(b) 10x inset on the C-A contact: the sliver of width 0.0068 that jams C; T_u shares C&#x27;s right flank.</text>
<text x="440.0" y="520.0" font-size="10" fill="#111">(c) the worst ring of the window (14|0|SL, s = 3.8771): the NEAR-FLAT LIFTED-END jam -- C 0.009 off the wall, A at offset 0.876;</text>
<text x="440.0" y="533.0" font-size="10" fill="#111">    worst BL-floor free square (orange) has margin -0.0631 = the flush value -(4-s)/2 = -0.0615: A259&#x27;s PAIR bound is sharp here.</text>
