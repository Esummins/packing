<text x="20.0" y="400.0" font-size="10" fill="#111">(a) A263&#x27;s non-ADJ floor at common tilt 2 deg, s = 3.8771: s1 at a = 0.03, W at shift e = 1.06 &gt;= sec 2 deg = 1.0006.</text>
<text x="20.0" y="413.0" font-size="10" fill="#111">    Green: the STRIP between s1&#x27;s upper-right edge line and W&#x27;s left flank line (width e cos phi = 1.0594 &gt;= 1) -- decided [T]:</text>
<text x="20.0" y="426.0" font-size="10" fill="#111">    a free square inside it slides along the flank direction (arrow) to a floor cell met by itself alone (dashed) unless a chain</text>
<text x="20.0" y="439.0" font-size="10" fill="#111">    of free squares below-right ends at the next wall&#x27;s START square; here the orange flat Q (exact check, free_margin 5.0e-03)</text>
<text x="20.0" y="452.0" font-size="10" fill="#111">    has a free drop of 0.02: P1 kills it.  Stipple: the region under s1&#x27;s vertex line, the case 1 + w - sec &lt;= e &lt; sec -- undecided [C].</text>
<text x="20.0" y="465.0" font-size="10" fill="#111">(b) 10x inset at Q&#x27;s floor gap (0.02) and its drop cell.</text>
