<text x="480.0" y="360.0" font-size="10" fill="#111">left: the LP minimiser of the + + + - pattern at all tilts 0.7 deg, s = 3.8771: a_w = s - 3, b_w = 1 -- the flat DOMINO</text>
<text x="480.0" y="373.0" font-size="10" fill="#111">pinwheel; wall 3 (pink) has sense -.  As drawn (b_w = 1 exactly) the END squares do NOT meet their boxes: the closed</text>
<text x="480.0" y="386.0" font-size="10" fill="#111">relaxation is feasible (least ring gap 0.0106), the strict box condition is violated by 0.  The LP margin tau* is</text>
<text x="480.0" y="399.0" font-size="10" fill="#111">0.00079 / 0.00039 / 0.00011 / 0.00003 at eps = 0.7 / 0.35 / 0.1 / 0.03 deg: proportional to eps (slab263).</text>
<text x="480.0" y="412.0" font-size="10" fill="#111">right: (tilt of a wall, s): the A261 certificates (green) stop at 0.703 deg; the slab (stipple) is UNDECIDED,</text>
<text x="480.0" y="425.0" font-size="10" fill="#111">certifiable by the same engine except in the all-near-flat cube of + + + - and + - + - (open_pairs.md s.5.3).</text>
