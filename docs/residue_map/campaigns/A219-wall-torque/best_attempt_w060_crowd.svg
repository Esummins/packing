<text x="685" y="70" font-size="13" fill="#222" font-weight="bold">WHAT THIS IS</text>
<text x="685" y="86" font-size="11" fill="#222">The best 11-square attempt at a balanced four-crowd:</text>
<text x="685" y="101" font-size="11" fill="#222">witness w060_crowd (CROWD), one square (blue, 3) placed as a</text>
<text x="685" y="116" font-size="11" fill="#222">holder at the best pose, then A217's optimiser with the four</text>
<text x="685" y="131" font-size="11" fill="#222">corner crowds FORCED (crowd rows, delta 0.02); side 4.0016.</text>
<text x="685" y="146" font-size="11" fill="#222"></text>
<text x="685" y="161" font-size="11" fill="#222">blue arrows = wall forces, black = square-square forces,</text>
<text x="685" y="176" font-size="11" fill="#222">RED = the crowd rows' external pulls still needed:</text>
<text x="685" y="191" font-size="11" fill="#222">sum of crowd multipliers 0.160 (free FJ residual 3.92e-02).</text>
<text x="685" y="206" font-size="11" fill="#222">No 11-square four-crowd balances without them (ring219.md).</text>
<text x="685" y="221" font-size="11" fill="#222"></text>
<text x="685" y="236" font-size="11" fill="#222">The free run from the same start drains to side 4.0000</text>
<text x="685" y="251" font-size="11" fill="#222">with 0 doubly-met open corners.</text>
<text x="685" y="266" font-size="12" fill="#222"></text>
<text x="685" y="274" font-size="10" fill="#666">renderer 0.06 s; geometry checked: arrow feet on the boundary (3e-16), min pair gap -6e-16, min wall gap -2e-15</text>
