<text x="464.9" y="619.4" font-size="11" fill="#d62728" text-anchor="middle">cw about P7</text>
<text x="701" y="70" font-size="13" fill="#222" font-weight="bold">WHAT THIS IS</text>
<text x="701" y="86" font-size="11" fill="#222">Addendum 2b: the STRUT MODE of square 6 on the ring</text>
<text x="701" y="101" font-size="11" fill="#222">rand_0_0569|t20 (side 4.1099).</text>
<text x="701" y="116" font-size="11" fill="#222"></text>
<text x="701" y="131" font-size="11" fill="#222">Square 6 (dark orange) carries exactly two loads: from 4 at P4</text>
<text x="701" y="146" font-size="11" fill="#222">and from 7 at P7 (black arrows, equal and opposite, collinear:</text>
<text x="701" y="161" font-size="11" fill="#222">moment of F4 about P7 = -2.7e-11); its floor row is active but</text>
<text x="701" y="176" font-size="11" fill="#222">UNLOADED (lam = 0.0).</text>
<text x="701" y="191" font-size="11" fill="#222"></text>
<text x="701" y="206" font-size="11" fill="#222">Rotating 6 about P7 clockwise by 1 mrad (dashed: x50):</text>
<text x="701" y="221" font-size="11" fill="#222">  floor gap  +5.98e-04  (opens, rate 0.598 per rad)</text>
<text x="701" y="236" font-size="11" fill="#222">  gap to 7   +2.50e-07  (holds: quadratic)</text>
<text x="701" y="251" font-size="11" fill="#222">  gap to 4   -7.50e-07  (closes at SECOND order only)</text>
<text x="701" y="266" font-size="11" fill="#222">  gap to 0   -6.42e-04  (the rattler 0, red, is hit at FIRST order)</text>
<text x="701" y="281" font-size="11" fill="#222"></text>
<text x="701" y="296" font-size="11" fill="#222">Lemma STRUT: a two-force strut has the rotation about either</text>
<text x="701" y="311" font-size="11" fill="#222">contact as a first-order zero mode of the loaded structure.</text>
<text x="701" y="326" font-size="11" fill="#222"></text>
<text x="701" y="341" font-size="11" fill="#222">Second order (Theorem SO, wall_torque.md s.5), loaded core</text>
<text x="701" y="356" font-size="11" fill="#222">(rattler rows dropped): v2 = max over the multiplier polytope of</text>
<text x="701" y="371" font-size="11" fill="#222">y^T Hess(L) y = +0.3813 &gt; 0: the side INCREASES at second order</text>
<text x="701" y="386" font-size="11" fill="#222">along the mode -- the ring is NOT a saddle here.</text>
<text x="701" y="401" font-size="11" fill="#222"></text>
<text x="701" y="416" font-size="11" fill="#222">With the rattler rows kept (11 squares) the mode is BLOCKED:</text>
<text x="701" y="431" font-size="11" fill="#222">rattler 0 is caged by 4, 5 and 6 (edge-edge contacts) and cannot</text>
<text x="701" y="446" font-size="11" fill="#222">yield at first order (completion LP infeasible: blocked).</text>
<text x="701" y="461" font-size="11" fill="#222"></text>
<text x="701" y="476" font-size="11" fill="#222">The dashed outline penetrates 4 by -1.9e-03 and 0 by -3.2e-02 at</text>
<text x="701" y="491" font-size="11" fill="#222">0.05 rad: an annotation of the first-order mode, not a packing.</text>
<text x="701" y="506" font-size="12" fill="#222"></text>
<text x="701" y="514" font-size="10" fill="#666">renderer 0.07 s; geometry checked: arrow feet on the boundary (5e-11), min pair gap -3e-16, min wall gap -3e-16</text>
</svg>