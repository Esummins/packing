<text x="701" y="70" font-size="13" fill="#222" font-weight="bold">WHAT THIS IS</text>
<text x="701" y="86" font-size="12" fill="#222">Lemma RING test on the nine-square ring rand_0_0569|t20</text>
<text x="701" y="102" font-size="12" fill="#222">(HELD, side 4.1099): tilt floor dropped, contact structure kept,</text>
<text x="701" y="118" font-size="12" fill="#222">free FJ LP (walls + the active pair rows, lam &gt;= 0): INFEASIBLE.</text>
<text x="701" y="134" font-size="12" fill="#222"></text>
<text x="701" y="150" font-size="12" fill="#222">orange = the 8 corner meeters, blue = holder 9, stipple = rattlers.</text>
<text x="701" y="166" font-size="12" fill="#222"></text>
<text x="701" y="182" font-size="12" fill="#222">ORANGE ARCS = the minimal external TORQUES that close the free</text>
<text x="701" y="198" font-size="12" fill="#222">balance (L1-minimal over all squares): every one is on a meeter,</text>
<text x="701" y="214" font-size="12" fill="#222">sign anti-aligning (the wall torques them flat, Lemma W); total</text>
<text x="701" y="230" font-size="12" fill="#222">0.587 (the tilt floor supplied 0.587).</text>
<text x="701" y="246" font-size="12" fill="#222"></text>
<text x="701" y="262" font-size="12" fill="#222">RED ARROWS = the external FORCES of the L1-minimal force+torque</text>
<text x="701" y="278" font-size="12" fill="#222">load (0.564): at the centres of the squares that carry them.</text>
<text x="701" y="294" font-size="12" fill="#222"></text>
<text x="701" y="310" font-size="12" fill="#222">Reading: the ring is force-balanced but not torque-balanced by</text>
<text x="701" y="326" font-size="12" fill="#222">walls and meeters alone; what is missing is a torque of sign</text>
<text x="701" y="342" font-size="12" fill="#222">chi on four tilted meeters (2, 4, 7, 8) -- a holder pushing</text>
<text x="701" y="358" font-size="12" fill="#222">each toward alignment.  The PI's L3 holds on this witness</text>
<text x="701" y="374" font-size="12" fill="#222">(and on all 193: ring219.md).</text>
<text x="60" y="756" font-size="11" fill="#222" font-weight="bold">Per-meeter torque residual (torque-only LP), tilt (deg), wall force W:</text>
<text x="60" y="774" font-size="11" fill="#222"> 2: tau_ext = -0.2386   tilt  70.0</text>
