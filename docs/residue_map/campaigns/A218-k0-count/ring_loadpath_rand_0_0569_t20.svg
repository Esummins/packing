<text x="701" y="70" font-size="13" fill="#222" font-weight="bold">WHAT THIS IS</text>
<text x="701" y="87" font-size="12" fill="#222">HELD local optimum rand_0_0569|t20, side 4.1099,</text>
<text x="701" y="104" font-size="12" fill="#222">11 unit squares; NOT a Fritz-John point of</text>
<text x="701" y="121" font-size="12" fill="#222">the free problem: the search floor |tilt| &gt;= 20 deg</text>
<text x="701" y="138" font-size="12" fill="#222">is active on 8 squares (four carry its torque).</text>
<text x="701" y="155" font-size="12" fill="#222"></text>
<text x="701" y="172" font-size="12" fill="#222">orange squares = the 8 corner meeters</text>
<text x="701" y="189" font-size="12" fill="#222">(BL 4,5  BR 6,7  TR 8,10  TL 2,3), all at 20 deg</text>
<text x="701" y="206" font-size="12" fill="#222">from alignment; blue = holder 9 (flat);</text>
<text x="701" y="223" font-size="12" fill="#222">grey stipple = 0, 1: no loaded contact (rattlers).</text>
<text x="701" y="240" font-size="12" fill="#222"></text>
<text x="701" y="257" font-size="12" fill="#222">ARROWS = FJ contact forces at the contact</text>
<text x="701" y="274" font-size="12" fill="#222">point, length and width ~ multiplier:</text>
<text x="701" y="291" font-size="12" fill="#222">blue = wall normal; black = force on the first</text>
<text x="701" y="308" font-size="12" fill="#222">square of the pair, dark grey = its reaction.</text>
<text x="701" y="325" font-size="12" fill="#222"></text>
<text x="701" y="342" font-size="12" fill="#222">ORANGE ARCS = torque the tilt floor supplies</text>
<text x="701" y="359" font-size="12" fill="#222">(units: force x side; + = counter-clockwise).</text>
<text x="701" y="376" font-size="12" fill="#222">No square and no wall supplies it: without the</text>
<text x="701" y="393" font-size="12" fill="#222">floor, 2 and 4 turn counter-clockwise and 7, 8</text>
<text x="701" y="410" font-size="12" fill="#222">clockwise: each toward alignment (Lemma W).</text>
<text x="701" y="427" font-size="12" fill="#222"></text>
<text x="701" y="444" font-size="12" fill="#222">LOAD PATH (a closed compression ring):</text>
<text x="701" y="461" font-size="12" fill="#222">wall x=0 -&gt; 5 -&gt; 4 -&gt; 6 -&gt; 7 &lt;- wall x=s;</text>
<text x="701" y="478" font-size="12" fill="#222">7 -&gt; 8 -&gt; 10 &lt;- wall y=s;  10 &lt;- 9 -&gt; 3 &lt;- wall y=s;</text>
<text x="701" y="495" font-size="12" fill="#222">3 &lt;- 2 &lt;- 5.  Floor meeters 4, 6 hold each other</text>
<text x="701" y="512" font-size="12" fill="#222">ALONG the floor; wall meeters 5|2 and 7|8 hold</text>
<text x="701" y="529" font-size="12" fill="#222">each other UP the walls; 9 holds both ceiling</text>
<text x="701" y="546" font-size="12" fill="#222">meeters.  Nine squares, force-balanced; torque-</text>
<text x="701" y="563" font-size="12" fill="#222">balanced only with the floor.  A218 s.5.</text>
<text x="701" y="580" font-size="12" fill="#222"></text>
<text x="701" y="590" font-size="10" fill="#666">renderer 0.01 s from A217 stress rows; geometry checked: arrow feet on both</text>
<text x="701" y="607" font-size="10" fill="#666">boundaries (5e-11), no overlaps, no wall crossing</text>
<text x="60" y="756" font-size="11" fill="#222" font-weight="bold">Per-square torque balance (force x side; + = counter-clockwise): tau_wall + tau_contact + tau_floor = 0</text>
<text x="60" y="774" font-size="11" fill="#222"> 2: tilt  70.0  W=0.000  tau_wall=+0.0000  tau_contact=+0.0727  tau_floor=-0.0727</text>
<text x="60" y="790" font-size="11" fill="#222"> 3: tilt  70.0  W=0.196  tau_wall=+0.0585  tau_contact=-0.0585  tau_floor=+0.0000</text>
<text x="60" y="806" font-size="11" fill="#222"> 4: tilt  70.0  W=0.391  tau_wall=+0.1169  tau_contact=+0.0489  tau_floor=-0.1659</text>
<text x="60" y="822" font-size="11" fill="#222"> 5: tilt  70.0  W=0.609  tau_wall=+0.1819  tau_contact=-0.1819  tau_floor=+0.0000</text>
<text x="60" y="838" font-size="11" fill="#222"> 6: tilt  20.0  W=0.000  tau_wall=+0.0000  tau_contact=-0.0000  tau_floor=+0.0000</text>
<text x="60" y="854" font-size="11" fill="#222"> 7: tilt  20.0  W=0.609  tau_wall=-0.1819  tau_contact=+0.1025  tau_floor=+0.0794</text>
<text x="60" y="870" font-size="11" fill="#222"> 8: tilt  20.0  W=0.000  tau_wall=+0.0000  tau_contact=-0.2688  tau_floor=+0.2688</text>
