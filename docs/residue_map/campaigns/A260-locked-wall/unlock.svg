<text x="1020.0" y="225.0" font-size="11" fill="#111">10x inset at the notch</text>
<text x="20.0" y="440.0" font-size="11" fill="#111">(a) BEFORE.  IS: corpus row &quot;A253 tau=14.545 s=3.877084&quot; (A253), ring of eight + the poker F (orange), exact coordinates; wall 2 is an OPEN PAIR:</text>
<text x="20.0" y="454.0" font-size="11" fill="#111">its END toucher W (blue) stands e = 0.0611 past the normal cell T = s1 + sec(phi) e (red dashes); M(T) = {W, F}: the wall is LOCKED.</text>
<text x="20.0" y="468.0" font-size="11" fill="#111">Checked: nine squares a packing (least gap / containment +0.0e+00); F dips 0.00761 into T (= the sliver in the inset; e sin(phi) = 0.01534).</text>
<text x="20.0" y="482.0" font-size="11" fill="#111">(b) AFTER the two-cell exchange of Lemma UNLOCK: W -&gt; T (the wall is a ROW OF TWO), F -&gt; Q = F lifted 0.00761 along s1&#x27;s edge direction.</text>
<text x="20.0" y="496.0" font-size="11" fill="#111">Checked: nine squares a packing (least gap / containment -4.4e-16); Q contains the centre O (margin +0.1083).  IS NOT a proof that a</text>
<text x="20.0" y="510.0" font-size="11" fill="#111">lock always lifts: with G, H present the lift may be HELD (P1 saturated) -- then the hybrid PAIR certificate (open_notch.svg) is what excludes it.</text>
</svg>
