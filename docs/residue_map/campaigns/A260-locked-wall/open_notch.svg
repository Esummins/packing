<text x="450.0" y="355.0" font-size="11" fill="#111">10x inset: the SLOT (width e cos(phi) = 0.1258)</text>
<text x="450.0" y="369.0" font-size="11" fill="#111">red: exact locus of the lowest vertex, shift e = 0.13</text>
<text x="450.0" y="383.0" font-size="11" fill="#111">blue: the closed tooth (e = 0), apex depth cos(phi)</text>
<text x="20.0" y="520.0" font-size="11" fill="#111">(a) IS: an open pair of common tilt 14.545 deg, shift e = 0.13 (s1 left, W right, T = the normal cell in red dashes), with the EXACT locus of the lowest</text>
<text x="20.0" y="534.0" font-size="11" fill="#111">vertex of a free unit square at its least depth, tilt psi = 0 .. 60 deg (red), against the closed tooth e = 0 (blue); centre sets of room259.</text>
<text x="20.0" y="548.0" font-size="11" fill="#111">Two free squares drawn (exact SAT vs s1, W &gt;= 0): psi = phi (orange) seated at the virtual apex, depth cos(phi)(1 - e sin(phi)) = 0.9363;</text>
<text x="20.0" y="562.0" font-size="11" fill="#111">psi = 24 deg (green) with its vertex IN the slot.  Least depth over all tilts 0.9345 &gt;= cos(phi) - e/2 = 0.9030 (POKE form); closed tooth: 0.9680.</text>
<text x="20.0" y="576.0" font-size="11" fill="#111">IS NOT the room bound: the box R^h built from these depths breaks HOLE-ONE beyond ~17 deg; the hybrid PAIR certificate (cert260) is the bound.</text>
