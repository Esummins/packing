<text x="800.0" y="450.0" font-size="11" fill="#111">(b) IS: the adversary&#x27;s worst all-ADJ HYBRID ring at s-hat (adv260, hard feasibility; shifts [0.054, 0.015, 0.006, 0.001]),</text>
<text x="800.0" y="464.0" font-size="11" fill="#111">the box R_cos (blue dashes, sides 1.896 x 1.896) and the enlarged R^h (red dots), the centre O, and the free square that comes</text>
<text x="800.0" y="478.0" font-size="11" fill="#111">closest to missing O: margin -0.0663 &lt; -(4-s)/2 = -0.0615; exact free margin +0.0e+00, contains O by +0.0663.</text>
<text x="800.0" y="492.0" font-size="11" fill="#111">IS NOT a certificate: [M].  The certificate is cert260 (hybA / hybB / hybAB), common tilt per wall.</text>
