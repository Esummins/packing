<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660"><rect width="100%" height="100%" fill="#ffffff"/>
<text x="20.00" y="26.00" font-size="15.0" fill="#111" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="bold">A250 -- FAMILY-STUCK needs 13 squares at s &gt;= 4 and 9 below 4 (exact, ILP over the PROJECTION catalogue)</text>
<text x="20.00" y="46.00" font-size="10.5" fill="#111" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">FAMILY-STUCK: every family Pi of pairwise disjoint border cells has |M(Pi)| &gt; |Pi| (else Lemma CELLS exchanges).  Which cells are disjoint depends on s.</text>
