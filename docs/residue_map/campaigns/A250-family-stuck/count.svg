<text x="40.00" y="420.00" font-size="10.0" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">Below 4 the two facing slots of each wall overlap (red): the largest family is 8 cells (4 boxes + one slot per wall) and family-stuck needs &gt;= 9 squares.</text>
<text x="40.00" y="433.00" font-size="10.0" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">At s &gt;= 4 all twelve are disjoint: family-stuck needs &gt;= 13 -- more than eleven.  So no packing of eleven unit squares at ANY side &gt;= 4 is family-stuck,</text>
<text x="40.00" y="446.00" font-size="10.0" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">while A244 certifies 488 TWELVE-stuck ones from 4.000010 to 4.5 and A247's UPPER-END only reaches down to 4 + sqrt2.  The family window is [3.82, 4) alone.</text>
<text x="40.00" y="490.00" font-size="11.0" fill="#111" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="bold">the count n_min (minimum squares an incidence structure needs), exact:</text>
<text x="430.00" y="506.00" font-size="10.0" fill="#111" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-weight="normal">s in [3, 4)</text>
<text x="540.00" y="506.00" font-size="10.0" fill="#111" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-weight="normal">s &gt;= 4</text>
<text x="40.00" y="522.00" font-size="10.0" fill="#333" text-anchor="start" font-family="ui-monospace,Consolas,monospace" font-weight="normal">|Pi| &lt;= 1  (A244 TWELVE-STUCK)</text>
<text x="430.00" y="522.00" font-size="10.0" fill="#111" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-weight="normal">8</text>
<text x="540.00" y="522.00" font-size="10.0" fill="#111" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-weight="normal">8</text>
<text x="40.00" y="537.00" font-size="10.0" fill="#333" text-anchor="start" font-family="ui-monospace,Consolas,monospace" font-weight="normal">|Pi| &lt;= 2  (pairs / dominoes)</text>
<text x="430.00" y="537.00" font-size="10.0" fill="#111" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-weight="normal">8</text>
<text x="540.00" y="537.00" font-size="10.0" fill="#111" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-weight="normal">8</text>
<text x="40.00" y="552.00" font-size="10.0" fill="#333" text-anchor="start" font-family="ui-monospace,Consolas,monospace" font-weight="normal">|Pi| &lt;= 3  (the brief's rows)</text>
<text x="430.00" y="552.00" font-size="10.0" fill="#111" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-weight="normal">8</text>
<text x="540.00" y="552.00" font-size="10.0" fill="#111" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-weight="normal">8</text>
<text x="40.00" y="567.00" font-size="10.0" fill="#333" text-anchor="start" font-family="ui-monospace,Consolas,monospace" font-weight="normal">|Pi| &lt;= 4</text>
<text x="430.00" y="567.00" font-size="10.0" fill="#111" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-weight="normal">8</text>
<text x="540.00" y="567.00" font-size="10.0" fill="#111" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-weight="normal">10</text>
<text x="40.00" y="582.00" font-size="10.0" fill="#333" text-anchor="start" font-family="ui-monospace,Consolas,monospace" font-weight="normal">every family (FAMILY-STUCK)</text>
<text x="430.00" y="582.00" font-size="10.0" fill="#111" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-weight="normal">9</text>
<text x="540.00" y="582.00" font-size="10.0" fill="#c02020" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-weight="normal">13</text>
<text x="600.00" y="582.00" font-size="10.0" fill="#c02020" text-anchor="start" font-family="ui-monospace,Consolas,monospace" font-weight="normal">13 &gt; 11: dead at every side &gt;= 4</text>
<text x="40.00" y="605.00" font-size="9.6" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">Dependencies: Lemma CELLS [T], PROJECTION / MAX-FIVE [T, A247] (a square meets cells of ONE five-cell corner neighbourhood), NOT-SELF-SUFFICIENT [T, A246], TWO-FAR [T, A247].</text>
<text x="40.00" y="617.00" font-size="9.6" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">Adding SLOT-MET and A247's 62 certified pair kills (436 D4 images) leaves both numbers unchanged.  9 &lt;= 11: the count does NOT close the window.</text>
