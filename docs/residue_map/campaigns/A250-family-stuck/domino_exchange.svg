<text x="40.00" y="492.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">Pi = {BL00, BL01} (the corner box and the wall slot up its wall) is met by exactly TWO squares in total, M1 = #2 and M2 = #6: |M(Pi)| = 2 = |Pi|.</text>
<text x="40.00" y="503.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">So the packing is NOT pair-stuck, and Lemma CELLS puts the two cells down as squares -- the corner pin (c,0,0) AND the slot pin (c,0,1): RAISE(0 -&gt; 2).</text>
<text x="40.00" y="515.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">Panel A check: min wall gap 2.75e-09, min pair gap 1.31e-11 (11 poses).   Panel B check: min wall gap 0.00e+00, min pair gap 0.00e+00 (9 kept + 2 cell squares).</text>
<text x="40.00" y="526.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">Corpus: 0 of A244's 488 certified twelve-stuck packings and 0 of A217's 486 witnesses are pair-stuck or family-stuck (count250, exact in verify250).</text>
