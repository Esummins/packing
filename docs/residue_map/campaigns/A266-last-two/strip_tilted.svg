<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="720" font-family="sans-serif">
<text x="40" y="18" font-size="15" font-weight="bold">A266 -- STRIP_2 for a TILTED C: the strip S = T_u \ C (orange), C (red), its wall drop T_u (violet), X (blue); dashed = the unit box</text>
<rect x="40" y="40" width="450" height="560" fill="#fafafa" stroke="#999"/><polygon points="40.00,600.00 190.00,600.00 190.00,450.00 40.00,450.00" fill="none" fill-opacity="0.50" stroke="#bbb" stroke-width="0.8" stroke-dasharray="4,3"/><polygon points="118.72,472.79 246.40,394.07 167.69,266.38 40.00,345.10" fill="#dde" fill-opacity="0.35" stroke="#88a" stroke-width="1.2" /><polygon points="118.72,472.79 40.00,345.10 167.69,266.38 207.48,330.92 184.48,345.10 223.41,408.24" fill="#e8a000" fill-opacity="0.55" stroke="#333" stroke-width="0.8" /><polygon points="263.20,472.79 390.88,394.07 312.17,266.38 184.48,345.10" fill="#c33" fill-opacity="0.35" stroke="#333" stroke-width="1.2" /><polygon points="73.20,324.71 219.48,291.51 186.28,145.23 40.00,178.43" fill="#36c" fill-opacity="0.35" stroke="#333" stroke-width="1.2" /><polygon points="54.79,552.03 204.79,552.03 204.79,402.03 54.79,402.03" fill="#2a2" fill-opacity="0.45" stroke="#060" stroke-width="1.6" /><text x="40" y="30" font-size="13" font-family="sans-serif">h_u=0.963 h_v=0.848 th_C=31.7° y_X=2.81 phi_X=12.8°</text><text x="40" y="620" font-size="11.5" font-family="sans-serif">[F] WITNESS for the reading "domain = h_u, h_v < 1": Q (green, flat, centre (0.60, 0.82)) is in the quadrant,</text><text x="40" y="635" font-size="11.5" font-family="sans-serif">interior-disjoint from C (gap +0.084) and X (gap +0.515), and meets int T_u (depth 0.47) -- a free square in the strip.</text><text x="40" y="650" font-size="11.5" font-family="sans-serif">But C MISSES the open unit box (its lower-left edge passes x = 1 above y = 1): this C is not a JAM floater.</text><text x="40" y="665" font-size="11.5" font-family="sans-serif">STRIP_2 needs the true domain "C meets (0,1)^2", i.e. h_u cos + h_v sin < cos + sin - sin cos (Lean open_box_tilted).</text>
<rect x="530" y="40" width="450" height="560" fill="#fafafa" stroke="#999"/><polygon points="530.00,600.00 680.00,600.00 680.00,450.00 530.00,450.00" fill="none" fill-opacity="0.50" stroke="#bbb" stroke-width="0.8" stroke-dasharray="4,3"/><polygon points="599.87,579.35 732.60,509.48 662.73,376.75 530.00,446.62" fill="#dde" fill-opacity="0.35" stroke="#88a" stroke-width="1.2" /><polygon points="599.87,579.35 530.00,446.62 662.73,376.75 690.44,429.38 657.70,446.62 699.86,526.72" fill="#e8a000" fill-opacity="0.55" stroke="#333" stroke-width="0.8" /><polygon points="727.57,579.35 860.30,509.48 790.43,376.75 657.70,446.62" fill="#c33" fill-opacity="0.35" stroke="#333" stroke-width="1.2" /><polygon points="590.46,458.50 727.74,398.03 667.27,260.76 530.00,321.22" fill="#36c" fill-opacity="0.35" stroke="#333" stroke-width="1.2" /><text x="530" y="30" font-size="13" font-family="sans-serif">h_u=0.851 h_v=0.138 th_C=27.8° y_X=1.86 phi_X=23.8°</text><text x="530" y="620" font-size="11.5" font-family="sans-serif">IN-DOMAIN configuration (C meets the open box, X above C meets T_u): NO unit square free of C and X in the</text><text x="530" y="635" font-size="11.5" font-family="sans-serif">quadrant meets S -- the box of radius 0.02 (positions) / 0.02 rad (tilts) around it is CERT by strip266.check_box</text><text x="530" y="650" font-size="11.5" font-family="sans-serif">(every 1° tilt bin of Q has an empty over-approximated bad set).  [T-computed] for this box; the 27-cell tree</text><text x="530" y="665" font-size="11.5" font-family="sans-serif">per lane is the certificate of the whole domain (its index says how far it is).</text>
<rect x="1020" y="40" width="450" height="560" fill="#fafafa" stroke="#999"/><polygon points="1172.74,675.48 1102.87,542.75 1051.57,401.79 1184.30,331.92 1325.26,280.62 1395.13,413.35 1446.43,554.31 1313.70,624.18" fill="#c33" fill-opacity="0.12" stroke="#333" stroke-width="1.2" /><polygon points="1045.04,675.48 975.17,542.75 923.87,401.79 1056.60,331.92 1197.56,280.62 1267.43,413.35 1318.73,554.31 1186.00,624.18" fill="#88a" fill-opacity="0.12" stroke="#333" stroke-width="1.2" /><polygon points="975.17,542.75 923.87,401.79 1056.60,331.92 1197.56,280.62 1218.09,319.63 1184.30,331.92 1051.57,401.79 1102.87,542.75 1152.21,636.47 1045.04,675.48" fill="#e8a000" fill-opacity="0.55" stroke="#333" stroke-width="0.8" /><polygon points="1035.64,554.63 975.17,417.35 923.87,276.40 1061.15,215.94 1202.10,164.63 1262.56,301.91 1313.87,442.86 1176.59,503.32" fill="#36c" fill-opacity="0.15" stroke="#333" stroke-width="1.2" /><line x1="1116.1" y1="40" x2="1116.1" y2="600" stroke="#000" stroke-dasharray="3,3"/><polygon points="1217.57,579.35 1350.30,509.48 1280.43,376.75 1147.70,446.62" fill="none" fill-opacity="0.50" stroke="#c33" stroke-width="1.0" /><polygon points="1089.87,579.35 1222.60,509.48 1152.73,376.75 1020.00,446.62" fill="none" fill-opacity="0.50" stroke="#88a" stroke-width="1.0" /><polygon points="1080.46,458.50 1217.74,398.03 1157.27,260.76 1020.00,321.22" fill="none" fill-opacity="0.50" stroke="#36c" stroke-width="1.0" /><text x="1020" y="620" font-size="11.5" font-family="sans-serif">CENTRE SETS at tilt psi = 20°: red = C (+) Q (centres of Q overlapping C), violet = T_u (+) Q,</text><text x="1020" y="635" font-size="11.5" font-family="sans-serif">orange = their difference = the LEFT SHADOW of C (+) Q of horizontal width h_u (the bad centres before X and</text><text x="1020" y="650" font-size="11.5" font-family="sans-serif">the wall); dashed = the wall constraint q_x >= w(psi)/2; blue = X (+) Q.  Bad centres = orange, right of the dash,</text><text x="1020" y="665" font-size="11.5" font-family="sans-serif">outside blue: area 0.00e+00 (EMPTY).  strip266 over-approximates exactly this set per tilt bin.</text>
</svg>