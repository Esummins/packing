<text x="776.00" y="71.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">(coordinator / PI, 2026-09-18): the bare ring is</text>
<text x="776.00" y="83.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">teleportable -- each eight-cell family {4 corner boxes</text>
<text x="776.00" y="94.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">+ one slot per wall} is met by the 8 ring squares</text>
