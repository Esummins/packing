<text x="776.00" y="117.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">square with a corner in the overlap [0,1]x[s-2,2]</text>
<text x="776.00" y="129.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">of one wall's two slots and its body in the centre.</text>
<text x="776.00" y="140.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">Capacity question: poker + two more?  With the</text>
<text x="776.00" y="152.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">poker pinned the residual centre set decides:</text>
<text x="776.00" y="163.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">diameter &lt; 1 =&gt; at most one more =&gt; capacity &lt;= 2.</text>
<text x="776.00" y="175.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">At s-hat the residual set is empty (panel b).</text>
