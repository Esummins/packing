<text x="776.00" y="129.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">the flat squares leave (Lemma GAP).  The disc of</text>
<text x="776.00" y="140.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">radius 1/2 at (3/2, 3/2) of the corner frame is then</text>
<text x="776.00" y="152.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">admissible, (s/2 - 3/2) sqrt2 &gt;= 0.58 from O on the window.</text>
<text x="776.00" y="163.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal"></text>
<text x="776.00" y="175.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">What survives (any n): SOME centre within 1/sqrt3,</text>
