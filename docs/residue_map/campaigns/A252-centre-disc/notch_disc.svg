<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430"><rect width="100%" height="100%" fill="#ffffff"/>
<rect x="37.94" y="57.94" width="302.11" height="302.11" fill="none" stroke="#222" stroke-width="1.6"/>
<text x="37.94" y="51.94" font-size="11.0" fill="#222" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">(a) the flat-flat corner: a disc of radius 1/2 in the NOTCH</text>
<rect x="37.94" y="243.86" width="116.20" height="116.20" fill="#fff8e6" stroke="#ccc" stroke-width="0.60"/>
<rect x="37.94" y="127.66" width="116.20" height="116.20" fill="#fff8e6" stroke="#ccc" stroke-width="0.60"/>
<rect x="154.14" y="243.86" width="116.20" height="116.20" fill="#fff8e6" stroke="#ccc" stroke-width="0.60"/>
<polygon points="62.10,249.67 175.76,225.51 151.60,111.85 37.94,136.01" fill="#dfe8fb" fill-opacity="0.75" stroke="#3b6fd6" stroke-width="1.3"/>
<text x="106.85" y="183.76" font-size="8.5" fill="#111" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">B</text>
<polygon points="269.34,360.06 271.37,243.88 155.19,241.85 153.16,358.03" fill="#fbe3e3" fill-opacity="0.75" stroke="#d63b3b" stroke-width="1.3"/>
<text x="212.27" y="303.95" font-size="8.5" fill="#111" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">A</text>
<circle cx="96.04" cy="301.96" r="3.0" fill="#3a9d5d"/>
<circle cx="96.04" cy="301.96" r="58.10" fill="none" stroke="#3a9d5d" stroke-width="1.2"/>
<text x="24.00" y="386.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">check: B (12 deg, 0.95) meets c00 and reaches (delta + w = 2.136); A (89 deg, 0.9916); gap(B, A) = 0.1007</text>
<text x="24.00" y="397.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">disc at (0.5, 0.5): 0.5009 from B, 0.4999 from A, 0.5 from both walls; the notch component has area 4.760,</text>
<text x="24.00" y="409.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">bounding box 2.600 x 2.600 &lt; 1 in width (delta_A &lt; 1): NO unit square fits, though the disc does</text>
<text x="400.00" y="60.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">(b) why disc-only criteria are lossy</text>
<text x="400.00" y="71.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">INRADIUS replaces a unit square by its inscribed disc;</text>
<text x="400.00" y="83.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">in the flat-flat corner limit the corner notch</text>
<text x="400.00" y="94.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">(left of A, below B) is a trapezoid of width &lt; 1</text>
<text x="400.00" y="106.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">and height ~ 0.9 .. 1.1 that holds the disc but no</text>
<text x="400.00" y="117.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">unit square.  So C acquires a far component</text>
<text x="400.00" y="129.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">(|q - O| ~ 2) and far_O, sec_r, the halves and disp3</text>
<text x="400.00" y="140.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">all fail there, while the capacity does not change.</text>
<text x="400.00" y="152.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal"></text>
<text x="400.00" y="163.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">Consequence: the proof of RING-POKER-RESIDUAL(11)</text>
<text x="400.00" y="175.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">must use square room (Lemma TWO-type bounds on the</text>
<text x="400.00" y="186.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">notch and mouth regions), or the box-valid pierce</text>
<text x="400.00" y="198.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">on the protected family -- not a disc radius alone.</text>
<text x="400.00" y="209.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal"></text>
<text x="400.00" y="221.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">Lemma NOTCH-SEP [T]: a notch disc BEHIND both edge</text>
<text x="400.00" y="232.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">lines L-&gt;V, V_A-&gt;W needs theta_B &gt; 45 deg,</text>
<text x="400.00" y="244.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">delta_B &gt;= phi(theta_B) (min phi = 0.862 at 63.7 deg)</text>
<text x="400.00" y="255.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">and the mirror for A; this panel is the OTHER</text>
<text x="400.00" y="267.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">notch case (below B's edge V-&gt;R, left of A's W-&gt;T).</text>
<text x="24.00" y="26.00" font-size="12.0" fill="#111" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="bold">A252 -- the corner notch of a flat-flat corner holds a disc of radius 1/2 and no unit square</text>
</svg>
