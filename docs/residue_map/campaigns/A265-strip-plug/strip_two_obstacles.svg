<text x="20.0" y="470.0" font-size="10" fill="#111">(a) BL corner of the JAM ring jam261_polished|3.877084|0.9 (s = 3.8771), the widest strip on the window: A, A2 floor row (blue), X wall</text>
<text x="20.0" y="483.0" font-size="10" fill="#111">    square (pink), C the floater (tan; h_u = 0.716 off the wall, h_v = 0.997 above the floor, tilt 4.3 deg).  Dashed blue: T_u = C</text>
<text x="20.0" y="496.0" font-size="10" fill="#111">    moved to the wall.  Stipple: the STRIP T_u minus C (area 0.730) -- [C] as a lemma, [T-computed] on 323 rings.  Red: X inside</text>
<text x="20.0" y="509.0" font-size="10" fill="#111">    T_u (the DIRECT-JAM, area 0.0522, depth 0.200): X seals the strip from above, C from the right, the wall from the left.</text>
<text x="20.0" y="522.0" font-size="10" fill="#111">    Orange: the unit square free of C and X (only) that meets T_u MOST (area 0.0000 of it inside T_u; free_margin -4.4e-16) --</text>
<text x="20.0" y="535.0" font-size="10" fill="#111">    it meets T_u only inside C&#x27;s own footprint region below C, never the stipple: strip265 finds NO square free of {C, X}</text>
<text x="20.0" y="548.0" font-size="10" fill="#111">    with an interior point in the strip on any of the 323 rings (both sectors -9 = no such square; A, A2, the sector unused).</text>
<text x="20.0" y="561.0" font-size="10" fill="#111">(b) 10x inset at X&#x27;s lowest point (1.870): the jam sliver.</text>
<text x="20.0" y="574.0" font-size="10" fill="#111">strip265 worst over 323 rings: {C,X}: -9.0 / -9.0;  {C}: -0.040 / -9.0;  {A,C}: -0.040 / -9.0;  {A,A2,X,C}: -9.0 / -9.0  (BL-floor / BL-left).</text>
