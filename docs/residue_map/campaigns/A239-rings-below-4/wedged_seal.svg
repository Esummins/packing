<text x="79.4" y="292.3" font-size="9" fill="#222" text-anchor="start">L=(sin th, 0)</text>
<circle cx="30.0" cy="215.7" r="2.5" fill="#222"/>
<text x="31.9" y="210.0" font-size="9" fill="#222" text-anchor="start">W=(0, cos th)</text>
<circle cx="159.8" cy="250.5" r="2.5" fill="#222"/>
<text x="161.7" y="244.8" font-size="9" fill="#222" text-anchor="start">R=(cos+sin, sin)</text>
<circle cx="112.3" cy="168.2" r="2.5" fill="#222"/>
<text x="114.2" y="162.5" font-size="9" fill="#222" text-anchor="start">T=(cos, cos+sin)</text>
<text x="43.3" y="286.6" font-size="8" fill="#333" text-anchor="middle">sealed</text>
<text x="111.7" y="288.5" font-size="9" fill="#a33" text-anchor="middle">T_f</text>
<text x="39.5" y="212.5" font-size="9" fill="#a33" text-anchor="middle">T_w</text>
<text x="30" y="314.0" font-size="10.5" fill="#222">(a) WHAT IT IS: the WEDGED square Q (tilt theta = 30 deg, centre (w/2, w/2), w = cos + sin = 1.366) with one</text>
<text x="30" y="327.0" font-size="10.5" fill="#222">   vertex on the floor and one on the wall of a corner; the open corner box (0,1)^2 dashed red; the sealed</text>
<text x="30" y="340.0" font-size="10.5" fill="#222">   triangle (area sin cos / 2 = 0.217) hatched; the two wedges T_f (apex angle theta) and T_w (apex angle 90 -</text>
<text x="30" y="353.0" font-size="10.5" fill="#222">   theta) shaded: the only parts of the box Q leaves uncovered.</text>
<text x="30" y="366.0" font-size="10.5" fill="#222">Lemma WEDGED-SEAL (= sideband.md Cor. B1): no unit square of the quadrant interior-disjoint from Q meets the</text>
<text x="30" y="379.0" font-size="10.5" fill="#222">   box -- no square can put a point into T_f or T_w (docs/proofs/wedged_seal.md s.2).  Far vertices at x, y =</text>
<text x="30" y="392.0" font-size="10.5" fill="#222">   cos + sin = 1.366 &gt;= 1.</text>
<text x="30" y="405.0" font-size="10.5" fill="#222">checks: Q in the quadrant (min coordinate -5.6e-17), touches both walls (x_min -2.8e-17, y_min -5.6e-17), meets</text>
<text x="30" y="418.0" font-size="10.5" fill="#222">   the box: True; Monte-Carlo: 20000 random unit squares of the quadrant meeting the box, interior-disjoint</text>
<text x="30" y="431.0" font-size="10.5" fill="#222">   from Q: 0 found (largest SAT gap -0.068 &lt; 0); draw 0.00 s, search 1.6 s.</text>
