<text x="50.9" y="580.9" font-size="10" fill="#222">f(alpha) - 1</text>
<text x="30" y="812.0" font-size="10.5" fill="#222">(c) WHAT IT IS: the wedge inequality of step 6, f(alpha) = sin th + cos th - sin th cot alpha + cos^2 alpha /</text>
<text x="30" y="825.0" font-size="10.5" fill="#222">   sin alpha &gt;= 1 for alpha in [theta, 90): blue = min over alpha of f - 1 (grid 0.05 deg), positive at every</text>
<text x="30" y="838.0" font-size="10.5" fill="#222">   theta in [0.5, 89.5] (least 3.8e-05 at theta = 89.5 deg, -&gt; 0 only as theta -&gt; 0 or 90); the two bounds of</text>
<text x="30" y="851.0" font-size="10.5" fill="#222">   the proof: (3/4) sin + cos - 1 for tan theta &lt;= 2 (dashed) and 1/sin - 1 for tan theta &gt; 2 (dotted), both &gt;=</text>
<text x="30" y="864.0" font-size="10.5" fill="#222">   0 on their ranges.</text>
<text x="30" y="877.0" font-size="10.5" fill="#222">Both sides vanish as theta -&gt; 0 (the wedge T_w opens to a full quadrant: W -&gt; (0, 1), a flush square beside Q</text>
