<text x="12" y="24" font-size="15" font-weight="bold" fill="#222">A239 -- Lemma WEDGED-SEAL (= Cor. B1): a corner meeter touching both walls is alone. (a) the wedged square and its wedges; (b) the proof objects; (c) the wedge inequality; (d) the consequence at a doubly-met corner</text>
<line x1="30.0" y1="298.0" x2="258.0" y2="298.0" stroke="#222" stroke-width="3.5"/>
<line x1="30.0" y1="298.0" x2="30.0" y2="70.0" stroke="#222" stroke-width="3.5"/>
<polygon points="30.0,298.0 125.0,298.0 125.0,203.0 30.0,203.0" fill="none" stroke="#d62728" stroke-width="1.6" stroke-dasharray="5,3"/>
