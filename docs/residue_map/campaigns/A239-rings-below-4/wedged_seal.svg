<text x="318" y="314.0" font-size="10.5" fill="#222">(b) WHAT IT IS: the objects of the proof at theta = 30 deg.  Strip = between the two dotted lines perpendicular</text>
<text x="318" y="327.0" font-size="10.5" fill="#222">   to the leaning edge L-R through L and R; Delta = the dashed triangle L R R' (the part of the strip below the</text>
<text x="318" y="340.0" font-size="10.5" fill="#222">   edge and above the floor); K = the open quadrant at R (stipple) that no second meeter G may enter (steps 1-4</text>
<text x="318" y="353.0" font-size="10.5" fill="#222">   of s.2).</text>
<text x="318" y="366.0" font-size="10.5" fill="#222">G* (blue) is the EXTREMAL admissible square of the wedge case: its edge lies along L-R and its vertex on the</text>
<text x="318" y="379.0" font-size="10.5" fill="#222">   floor; its least abscissa is 1/sin theta = 2.000 &gt; 1, so it misses the box.  Purple: the separating line</text>
<text x="318" y="392.0" font-size="10.5" fill="#222">   through R at angle alpha = 60 deg of step 5, meeting the floor at A0; every square below it and above the</text>
<text x="318" y="405.0" font-size="10.5" fill="#222">   floor has min u &gt;= f(alpha) = 1.366 &gt;= 1 (step 6).</text>
<text x="318" y="418.0" font-size="10.5" fill="#222">checks: Q, G* in the quadrant (min coordinate -5.6e-17), SAT gap Q-G* 7.3e-01 &gt;= 0, G* min x = 2.0000 = 1/sin</text>
<text x="318" y="431.0" font-size="10.5" fill="#222">   theta; draw 0.00 s.</text>
