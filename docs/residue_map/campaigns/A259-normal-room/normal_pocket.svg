" stroke="#34495e" stroke-width="1.00"/><polygon points="183.73,305.01 299.64,273.95 268.58,158.04 152.67,189.10" fill="none" fill-opacity="1.00" stroke="#c0392b" stroke-width="1.60"/><polygon points="172.99,410.56 390.56,352.26 332.26,134.69 114.69,192.99" fill="none" fill-opacity="1.00" stroke="#1a7" stroke-width="1.20" stroke-dasharray="5,3"/><circle cx="252.63" cy="272.63" r="3.0" fill="#000"/><polygon points="20.00,505.25 485.25,505.25 485.25,40.00 20.00,40.00" fill="none" fill-opacity="1.00" stroke="#000" stroke-width="1.50"/><polygon points="136.15,389.10 369.10,389.10 369.10,156.15 136.15,156.15" fill="none" fill-opacity="1.00" stroke="#2255cc" stroke-width="1.20" stroke-dasharray="2,3"/></g><text x="20" y="20" font-size="12" font-family="sans-serif" fill="#111">PANEL 1 IS: the C4 normal ring (four common-tilt pairs, 14.545 deg, delta = 0.7120) at s-hat, in D.</text><text x="20" y="523" font-size="12" font-family="sans-serif" fill="#111">Amber = the EXACT set of admissible centres of a free unit square (union over a 1-degree tilt grid).  Black dot = O.</text><text x="20" y="539" font-size="12" font-family="sans-serif" fill="#111">Red = the free square FARTHEST from containing O (exact check passed): it still contains O, margin -0.1121.</text><text x="20" y="555" font-size="12" font-family="sans-serif" fill="#111">Blue dots = R_cos = [cos phi, s - cos phi]^2 (TOOTH: no vertex dips below cos phi).  Green dashes = the ROTATED HOLE:</text><text x="20" y="571" font-size="12" font-family="sans-serif" fill="#111">side s - 2 at the free square's own tilt; [M] every free square of that tilt lies inside it (margin >= (4-s)/2).</text></svg>