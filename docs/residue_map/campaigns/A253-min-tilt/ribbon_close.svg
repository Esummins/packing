<text x="696.00" y="42.00" font-size="10.5" fill="#111" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">(c) wall x = 0, ribbon [0,1] x [1.877, 2]  --  tau = 0: the wall block [0,1]x[1,3] covers the ribbon</text>
<text x="24.00" y="372.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">check: the two wall touchers B_BL, B_TL are drawn from the certified ring rows; the ribbon rectangle is exactly [0,1] x [s-2, 2] (A252's slot overlap of the wall x = 0).</text>
<text x="24.00" y="383.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">As tau falls the two touchers lean back towards flush and the wedge at the wall that the poker's corner uses closes; at tau = 0 the block covers the ribbon entirely, so the poker dies EXACTLY in the limit.</text>
<text x="24.00" y="395.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">This is the PI's blocking mechanism -- the blocker is the pair of wall touchers of the wall itself, not a corner square -- but the threshold is 0, not positive.</text>
<text x="24.00" y="26.00" font-size="12.5" fill="#111" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="600">A253 -- the ribbon closes only in the limit: the wall block against the slot-overlap ribbon</text>
