<text x="380.00" y="376.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">check: least pair gap +0.00e+00 (touching dominoes), contained True; pocket = hole 1.8771^2 + four 0.8771 x 1 notches</text>
<text x="380.00" y="387.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">the ribbon (orange) lies INSIDE the wall block [0,1]x[1,3]: no poker at tau = 0; the hole (green) has side s-2 &lt; 2, so it holds ONE square (Lemma HOLE-ONE)</text>
<text x="724.00" y="62.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">[F] there is no POSITIVE minimum tilt: theta_min(s) = 0 on the window.</text>
<text x="724.00" y="73.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">For every tau &gt; 0 the pinwheel sign pattern 00110011 carries a ring AND a</text>
<text x="724.00" y="85.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">poker; the joint margin degenerates like M ~ c(s) tau (tau -&gt; 0) and the</text>
<text x="724.00" y="96.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">limit tau = 0 is the four-corner-domino pinwheel, a boundary point of the</text>
<text x="724.00" y="108.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">family (each corner box is met by ONE square there, not two).</text>
<text x="724.00" y="119.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal"></text>
<text x="724.00" y="131.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">[T] At the limit the room is EXACTLY 1: the pocket is the central square</text>
<text x="724.00" y="142.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">hole of side s - 2 &lt; 2 (Lemma HOLE-ONE: every unit square in a square of</text>
<text x="724.00" y="154.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">side &lt;= 2 contains its centre, with slack (4 - s)/2) plus four isolated</text>
<text x="724.00" y="165.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">1 x (s - 3) notches, too narrow for a unit square (Lemma NOTCH-NARROW).</text>
<text x="724.00" y="177.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">So 8 + 1 = 9 &lt; 11 AT the extremal tilt, by theorem, with no search.</text>
<text x="24.00" y="26.00" font-size="12.5" fill="#111" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="600">A253 -- the minimum-tilt ring: theta_min = 0, and the flush limit is the four-corner-domino pinwheel (s = 3.877084)</text>
