<text x="1218" y="620.0" font-size="10.5" fill="#222">geometry check: True (min pair gap -7.8e-13, min wall -3.6e-13)</text>
<text x="1218" y="633.0" font-size="10.5" fill="#222">(c) record n = 26 (Friedman 1997), side 5.6213 &lt; 6: B = 15, K = 6, X = 5, tilted 9, four flush corners, no doubly-met corner.</text>
<text x="1218" y="646.0" font-size="10.5" fill="#222">The X straddlers are the tilted grain crossing the band line: the record is CROSS-BRACED.  Count bound B &lt;= 4(m-2) = 16 would</text>
<text x="1218" y="659.0" font-size="10.5" fill="#222">apply only to a four-crowd; here B = 15 because the four corner slots are flush.  N_record(s - 2 = 3.62) = 9 &gt;= K = 6.</text>
<text x="1218" y="672.0" font-size="10.5" fill="#222">Every record n = 5..55 satisfies TILT-BAND, BAND-FLUSH, WALL-EXCESS and K &lt;= N(s-2) (capacity236.md); none is a ring.</text>
