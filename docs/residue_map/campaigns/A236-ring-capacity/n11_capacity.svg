<text x="624" y="620.0" font-size="10.5" fill="#222">geometry check: True (min pair gap 0.0e+00, min wall 0.0e+00)</text>
<text x="624" y="633.0" font-size="10.5" fill="#222">(b) the count at n = 11, s = 3.99 &lt; 4: a four-crowd has no corner slot square, so a wall with 3 flush touchers CLAIMS both its corner</text>
<text x="624" y="646.0" font-size="10.5" fill="#222">boxes and a wall with 2 claims one; two walls cannot claim the same corner (OVERLAP): B &lt;= 4*3 - 4 = 8 (drawn: 3 + 2 + 2 + 1).</text>
<text x="624" y="659.0" font-size="10.5" fill="#222">The centre (1, s-1)^2 has side &lt; 2 and holds K &lt;= 1 square (Lemma TWO).  ONE-TILTED gives X &gt;= 4 tilted meeters (not drawn: they</text>
<text x="624" y="672.0" font-size="10.5" fill="#222">must intrude past the claimed slots).  8 + 1 + 4 = 13 &gt;= 11 = n: the count leaves slack 2 = m^2 - 3 - n and closes nothing;</text>
<text x="624" y="685.0" font-size="10.5" fill="#222">the four tilted meeters have to fit beside the 8 flush slots AND the pocket has to hold the rest -- a region question (A226: 9 &lt; 11).</text>
