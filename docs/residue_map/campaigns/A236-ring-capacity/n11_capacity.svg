<text x="30" y="633.0" font-size="10.5" fill="#222">(a) TILT-BAND: a unit square of tilt 10 deg touching both walls of BL (a = b = 0), side 3.99.  Its max-x vertex v_R =</text>
<text x="30" y="646.0" font-size="10.5" fill="#222">   (1.158, 0.174)</text>
<text x="30" y="659.0" font-size="10.5" fill="#222">and max-y vertex v_T = (0.985, 1.158) span an edge (red) whose points at parameters l in (0.839, 0.913) have x &gt; 1</text>
<text x="30" y="672.0" font-size="10.5" fill="#222">   AND y &gt; 1:</text>
<text x="30" y="685.0" font-size="10.5" fill="#222">the dot (1.006, 1.036) is in the open centre -- lower &lt; upper because (1 - cos)(1 - sin) &gt; 0.  iota(10 deg) = cos +</text>
<text x="30" y="698.0" font-size="10.5" fill="#222">   sin - 1 = 0.158,</text>
<text x="30" y="711.0" font-size="10.5" fill="#222">depth into the centre 0.011: positive for every tilt, with NO floor (both -&gt; 0 as the tilt -&gt; 0; A89: no loaded tilt</text>
<text x="30" y="724.0" font-size="10.5" fill="#222">   floor exists).</text>
