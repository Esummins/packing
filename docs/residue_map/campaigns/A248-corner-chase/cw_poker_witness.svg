<rect x="40.0" y="220.0" width="180.0" height="180.0" fill="#dbe9f6" stroke="#999" stroke-dasharray="4 3"/>
<text x="49.0" y="241.6" font-size="13" fill="#555">BL01</text>
<rect x="220.0" y="400.0" width="180.0" height="180.0" fill="#e2f0d9" stroke="#999" stroke-dasharray="4 3"/>
<text x="229.0" y="421.6" font-size="13" fill="#555">BL10</text>
<line x1="40.0" y1="580.0" x2="40.0" y2="40.0" stroke="#333" stroke-width="3"/>
<line x1="40.0" y1="580.0" x2="580.0" y2="580.0" stroke="#333" stroke-width="3"/>
<polygon points="211.0,580.0 391.0,580.0 391.0,400.0 211.0,400.0" fill="#f4c7a1" stroke="#b06a00" stroke-width="2" fill-opacity="0.85"/>
<polygon points="40.0,310.0 184.0,418.0 292.0,274.0 148.0,166.0" fill="#c9d7ee" stroke="#1f4e79" stroke-width="2" fill-opacity="0.85"/>
<circle cx="184.0" cy="418.0" r="5" fill="#d62728"/>
<circle cx="40.0" cy="310.0" r="5" fill="#1f77b4"/>
<circle cx="166.0" cy="292.0" r="3" fill="#1f4e79"/>
<text x="301.0" y="490.0" font-size="14" text-anchor="middle">A</text>
<text x="166.0" y="292.0" font-size="14" text-anchor="middle" dy="-8">poker</text>
<text x="630" y="50" font-size="12" fill="#222">WHAT THIS IS: A248 exact witness of a poker</text>
<text x="630" y="67" font-size="12" fill="#222">tilted the OTHER way. Poker vertices (0,1.5),</text>
<text x="630" y="84" font-size="12" fill="#222">(0.8,0.9), (1.4,1.7), (0.6,2.3): edges (0.8,-0.6)</text>
<text x="630" y="101" font-size="12" fill="#222">and (0.6,0.8), both length 1, perpendicular.</text>
<text x="630" y="118" font-size="12" fill="#222">Centre (0.7,1.6) (dot). Lowest vertex (red) at</text>
<text x="630" y="135" font-size="12" fill="#222">x = 0.8 is RIGHT of the centre; wall vertex (blue)</text>
<text x="630" y="152" font-size="12" fill="#222">at (0,1.5). A is flat at [0.95,1.95] x [0,1].</text>
<text x="630" y="169" font-size="12" fill="#222"></text>
<text x="630" y="186" font-size="12" fill="#222">GEOMETRY CHECK (separating axes): poker-A gap</text>
<text x="630" y="203" font-size="12" fill="#222">0.0600 > 0 (disjoint); poker meets int BL00: True;</text>
<text x="630" y="220" font-size="12" fill="#222">A meets int BL00: True; poker meets int BL01: True.</text>
<text x="630" y="237" font-size="12" fill="#222"></text>
<text x="630" y="254" font-size="12" fill="#222">A CCW poker (< 45 deg) has its lowest vertex LEFT</text>
<text x="630" y="271" font-size="12" fill="#222">of centre. This one is tilted 53.13 deg (edge at</text>
<text x="630" y="288" font-size="12" fill="#222">-36.87 deg): the sense is not forced by poking.</text>
<text x="630" y="305" font-size="12" fill="#222">Not claimed: that it is locked, or that a second</text>
<text x="630" y="322" font-size="12" fill="#222">meeter of BL01 exists here (none drawn).</text>
</svg>