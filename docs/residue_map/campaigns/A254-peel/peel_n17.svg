<text x="20" y="26" font-size="17" font-weight="bold">A254 PEEL -- n = 17: s &gt;= 2 + s(n - 4(m-2)) at the tight flush pinwheel [T]</text>
<text x="20" y="46" font-size="12">blue = the 4(m-2) flush ring squares (tight pinwheel: four 1 x (m-2) wall blocks, wall gaps 0); hatched = the four corner notches, width s-(m-1) &lt; 1: hold NO unit square [T, NOTCH-NARROW];</text>
<text x="20" y="62" font-size="12">red dashes = the hole [1, s-1]^2 of side s-2; orange = the inner packing; grey stipple = UNDECIDED (never green): whether n' squares fit is an open value of s(n').</text>
