<svg xmlns="http://www.w3.org/2000/svg" width="858" height="498" font-family="sans-serif"><defs><pattern id="stip" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="0.9" fill="#a0aec0"/></pattern></defs><text x="30.0" y="32.0" font-size="12" font-weight="bold">(a) a RING with ONE JAM corner, s = s-hat [M, exact check]</text><polygon points="30.00,408.32 398.32,408.32 398.32,40.00 30.00,40.00" fill="none" stroke="#1a202c" stroke-width="2.4"/><polygon points="30.00,408.32 125.00,408.32 125.00,313.32 30.00,313.32" fill="#faf089" fill-opacity="0.35" stroke="#b7791f" stroke-width="0.8" stroke-dasharray="4,3"/><polygon points="303.32,408.32 398.32,408.32 398.32,313.32 303.32,313.32" fill="#faf089" fill-opacity="0.35" stroke="#b7791f" stroke-width="0.8" stroke-dasharray="4,3"/><polygon points="303.32,135.00 398.32,135.00 398.32,40.00 303.32,40.00" fill="#faf089" fill-opacity="0.35" stroke="#b7791f" stroke-width="0.8" stroke-dasharray="4,3"/><polygon points="30.00,135.00 125.00,135.00 125.00,40.00 30.00,40.00" fill="#faf089" fill-opacity="0.35" stroke="#b7791f" stroke-width="0.8" stroke-dasharray="4,3"/><circle cx="214.2" cy="224.2" r="3" fill="#c53030"/><text x="219.2" y="219.2" font-size="11">O</text><polygon points="126.35,408.32 218.58,385.52 195.78,293.30 103.55,316.10" fill="#2b6cb0" fill-opacity="0.20" stroke="#2b6cb0" stroke-width="1.4"/><text x="161.1" y="354.8" font-size="11" fill="#2b6cb0" text-anchor="middle">A</text><polygon points="224.21,408.32 316.44,385.52 293.64,293.30 201.41,316.10" fill="#2b6cb0" fill-opacity="0.20" stroke="#2b6cb0" stroke-width="1.4"/><text x="258.9" y="354.8" font-size="11" fill="#2b6cb0" text-anchor="middle">A2</text><polygon points="398.32,318.56 387.17,224.22 292.83,235.37 303.98,329.71" fill="#2b6cb0" fill-opacity="0.20" stroke="#2b6cb0" stroke-width="1.4"/><text x="345.6" y="281.0" font-size="11" fill="#2b6cb0" text-anchor="middle">R1</text><polygon points="398.32,222.90 387.17,128.56 292.83,139.71 303.98,234.05" fill="#2b6cb0" fill-opacity="0.20" stroke="#2b6cb0" stroke-width="1.4"/><text x="345.6" y="185.3" font-size="11" fill="#2b6cb0" text-anchor="middle">R2</text><polygon points="314.02,40.00 219.65,50.92 230.57,145.29 324.94,134.37" fill="#2b6cb0" fill-opacity="0.20" stroke="#2b6cb0" stroke-width="1.4"/><text x="272.3" y="96.6" font-size="11" fill="#2b6cb0" text-anchor="middle">T1</text><polygon points="218.38,40.00 124.01,50.92 134.94,145.29 229.31,134.37" fill="#2b6cb0" fill-opacity="0.20" stroke="#2b6cb0" stroke-width="1.4"/><text x="176.7" y="96.6" font-size="11" fill="#2b6cb0" text-anchor="middle">T2</text><polygon points="30.00,139.99 64.21,228.62 152.84,194.41 118.63,105.78" fill="#2b6cb0" fill-opacity="0.20" stroke="#2b6cb0" stroke-width="1.4"/><text x="91.4" y="171.2" font-size="11" fill="#2b6cb0" text-anchor="middle">X</text><polygon points="106.68,314.31 198.89,291.48 176.06,199.26 83.84,222.10" fill="#dd6b20" fill-opacity="0.20" stroke="#dd6b20" stroke-width="1.4"/><text x="141.4" y="260.8" font-size="11" fill="#dd6b20" text-anchor="middle">C</text><polygon points="229.12,193.61 250.86,191.09 251.04,192.64 239.90,194.01 246.66,251.21 241.88,251.80 240.25,238.54" fill="#6b46c1" fill-opacity="0.35" stroke="#6b46c1" stroke-width="0.8"/><polygon points="209.50,244.03 303.79,232.45 292.21,138.16 197.92,149.74" fill="none" fill-opacity="0.20" stroke="#718096" stroke-width="1.4" stroke-dasharray="5,3"/><text x="250.9" y="195.1" font-size="11" fill="#718096" text-anchor="middle">Q</text><text x="30.0" y="424.3" font-size="10.5" fill="#2d3748">IS: floor row A, A2; right and top rows; left wall carries X ONLY; C FLOATS (0.567 off the wall) and meets the BL box</text><text x="30.0" y="437.3" font-size="10.5" fill="#2d3748">by a sliver (depth 0.0104).  JAM margin t = 0.0104, J = -0.0104 (no wall cell receives C).  Purple: exact centre set of</text><text x="30.0" y="450.3" font-size="10.5" fill="#2d3748">free squares at the worst tilt (7 deg); Q = the free square of largest miss: pierce margin -0.0742 &lt; 0, it CONTAINS O.</text><text x="30.0" y="463.3" font-size="10.5" fill="#2d3748">Count: 8 outer + at most 1 (all free squares contain O) = 9 &lt; 11.  [M] on a 1-degree tilt grid -- not a certificate.</text><text x="438.3" y="32.0" font-size="12" font-weight="bold">(b) 20x inset at C&#x27;s lowest vertex: the sliver in the box</text><polygon points="438.32,328.00 726.32,328.00 726.32,135.06 438.32,135.06" fill="#faf089" fill-opacity="0.45" stroke="#b7791f" stroke-width="0.8"/><polygon points="533.75,328.00 726.32,328.00 726.32,150.09 503.39,205.20" fill="#2b6cb0" fill-opacity="0.25" stroke="#2b6cb0" stroke-width="1.2"/><polygon points="726.32,124.34 726.32,40.00 552.61,40.00 582.32,160.00" fill="#dd6b20" fill-opacity="0.25" stroke="#dd6b20" stroke-width="1.2"/><text x="438.3" y="344.0" font-size="10.5" fill="#2d3748">IS: a 0.12 x 0.12 window.  Yellow = the box (y &lt; 1).  Orange = C: lowest vertex (0.8071, 0.9896),</text><text x="438.3" y="357.0" font-size="10.5" fill="#2d3748">inside the box by 0.0104.  Blue = A (gap C-A 0.0104).  Retreat of length</text><text x="438.3" y="370.0" font-size="10.5" fill="#2d3748">&lt;= (1 - 0.9896)/sin(tilt) = 0.0432 takes C off the box: P4 (RETREAT) =&gt; C is HELD.</text></svg>