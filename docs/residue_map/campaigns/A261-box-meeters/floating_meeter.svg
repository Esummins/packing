</g><text x="1122" y="182" font-size="9.5">10x inset at the overlap</text>
<text x="760.0" y="386.0" font-size="10.5" fill="#2d3748">IS: A (floor, 13.67 deg) and C (floats 0.724 off the wall, 13.69 deg) meet the box; X (wall, 27.91 deg) does not.</text>
<text x="760.0" y="399.0" font-size="10.5" fill="#2d3748">Pairwise gaps &gt;= 0.0104, box depths C 0.0104, A 0.0693.  Every wall-touching unit cell (any tilt, either wall)</text>
<text x="760.0" y="412.0" font-size="10.5" fill="#2d3748">that meets C overlaps A or X by &gt;= 0.0090 (inner sup, fine grid + Nelder-Mead [M]); no EMPTY wall cell</text>
<text x="760.0" y="425.0" font-size="10.5" fill="#2d3748">either (-0.069).  Red dashed: the freest receiving cell, overlapping A (sliver, inset).  The wedge between</text>
<text x="760.0" y="438.0" font-size="10.5" fill="#2d3748">X&#x27;s edge (steep) and A&#x27;s edge (shallow) closes TOWARDS the wall: C fits where no wall toucher does.</text>
<text x="760.0" y="451.0" font-size="10.5" fill="#2d3748">A LOCAL counterexample to TOUCH-NORMAL-from-P1; whether a ring closes round it on the window is open.</text></svg>