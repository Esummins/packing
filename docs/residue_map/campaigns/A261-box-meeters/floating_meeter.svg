<polygon points="146.61,356.96 193.36,344.78 171.54,261.05 124.80,273.23" fill="#c53030" fill-opacity="0.55" stroke="none"/>
<polygon points="55.22,285.99 151.99,260.77 126.77,164.00 30.00,189.22" fill="none" fill-opacity="0.20" stroke="#2f855a" stroke-width="1.4" stroke-dasharray="6,2"/>
<text x="30.0" y="386.0" font-size="10.5" fill="#2d3748">IS: three unit squares in the corner frame (pairwise gaps &gt;= 0.052): A touches the floor, X the wall,</text>
<text x="30.0" y="399.0" font-size="10.5" fill="#2d3748">C floats 0.414 off the wall and 0.948 off the floor; C and A meet the box (yellow).</text>
<text x="30.0" y="412.0" font-size="10.5" fill="#2d3748">Red dashed: C dropped straight onto each wall -- BLOCKED (overlap red: X by 0.052, A by 0.483).</text>
<text x="30.0" y="425.0" font-size="10.5" fill="#2d3748">Green dashed: C slid along its own edge direction to the wall: met by C only (gap to A, X &gt;= 0.0520),</text>
<text x="30.0" y="438.0" font-size="10.5" fill="#2d3748">so (E2) lands C and Phi1 rises.  A straight drop is the WRONG test; any-pose P1 is the right one.</text>
<text x="760.0" y="32.0" font-size="12" font-weight="bold">(b) JAM [M, exact check]: the JAMMED floater -- NO wall cell receives C (freest cell drawn)</text>
<polyline points="760.0,40.0 760.0,370.0 1090.0,370.0" fill="none" stroke="#1a202c" stroke-width="2.4"/>
<polygon points="760.00,370.00 860.00,370.00 860.00,270.00 760.00,270.00" fill="#faf089" fill-opacity="0.35" stroke="#b7791f" stroke-width="0.8" stroke-dasharray="4,3"/>
