<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="480" font-family="sans-serif"><rect width="100%" height="100%" fill="white"/><defs><pattern id="stip" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="0.9" fill="#a0aec0"/></pattern></defs>
<text x="30.0" y="32.0" font-size="12" font-weight="bold">(a) LIFT [M, exact check]: floating meeter C, both straight DROPS blocked -- and the cell that lands it</text>
