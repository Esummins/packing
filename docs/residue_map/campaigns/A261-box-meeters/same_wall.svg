<text x="30.0" y="368.0" font-size="10.5" fill="#2d3748">IS: an ILLUSTRATION of the lemma, not a witness: any two unit squares touching the same wall of the</text>
<text x="30.0" y="381.0" font-size="10.5" fill="#2d3748">corner and both meeting the open box (yellow) overlap.  Proof: a separating line would have a normal n</text>
<text x="30.0" y="394.0" font-size="10.5" fill="#2d3748">(from A1 to A2) with n_u &gt; 0 because A2 touches the floor, and -n_u &gt; 0 because A1 does (Lemma PUSH (ii)).</text>
<text x="30.0" y="407.0" font-size="10.5" fill="#2d3748">With WEDGED-SEAL: a doubly-met box has AT MOST one toucher per wall; every further meeter FLOATS.</text>
