<text x="60" y="957" font-size="11" fill="#222">(&gt; 180: it contains the lines through P along e and along f, so the first-order condition is KKT for S_A AND for S_B).</text>
<text x="60" y="973" font-size="10" fill="#666">inset geometry checked: excluded wedge 140.0000 deg = 180 - angle(n_e, -n_f) = 180 - 40.0000.</text>
