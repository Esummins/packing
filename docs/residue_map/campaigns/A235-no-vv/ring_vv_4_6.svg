<text x="375.8" y="530.5" font-size="11" fill="#d62728">P</text>
<text x="701" y="70" font-size="12" fill="#222" font-weight="bold">A235 -- the ring (rand_0_0569|t20, s = 4.1099): the lean 4|6 is a tilted VERTEX-ON-VERTEX contact</text>
<text x="701" y="86" font-size="12" fill="#222">tilts 4: 70 deg, 6: 20 deg (gap 40 deg); P = (2.0586, 0.9397) = corner of 4 = corner of 6 = corner of rattler 0</text>
<text x="701" y="102" font-size="12" fill="#222">dashed: the two separating edge lines through P (orange: 4's edge e, blue: 6's edge f); the pair is</text>
<text x="701" y="118" font-size="12" fill="#222">interior-disjoint near P iff  g_A &gt;= 0  OR  g_B &gt;= 0  (a UNION of half-spaces; inset below).</text>
<text x="701" y="134" font-size="12" fill="#222">arrows at P: the physical force cone on 6, between n_e (orange, selection S_A) and -n_f (blue, S_B).</text>
<text x="701" y="150" font-size="12" fill="#222">load of the 4|6 rows over the FJ polytope: [0.000, 0.572]; 0|6 rows: [0.000, 0.572] -- the 0.572 crosses the</text>
<text x="701" y="166" font-size="12" fill="#222">triple point through 4|6 or through 0|6: the rows are DEPENDENT (grad g_A in the span of the others).</text>
<text x="701" y="182" font-size="12" fill="#222">two-selection test: S_A KKT, S_B KKT (both KKT: no first-order exclusion at this pair).</text>
<text x="701" y="198" font-size="12" fill="#222"></text>
<text x="701" y="214" font-size="12" fill="#222" font-weight="bold">The rolling plane at P (rotations of 6 (red) and of 4 (green) about P; both VV rows exactly zero):</text>
<text x="701" y="230" font-size="11" fill="#222">  6 ccw: blocked at first order by 7's corner on 6's edge (rate -0.50, lam 0.42); 6's corner on 7's edge (line row) (rate -1.00, lam 0.00)</text>
<text x="701" y="246" font-size="11" fill="#222">  6 cw: blocked at first order by wall y=0 of 6 (rate -0.34, lam 0.39); 7's corner on 6's edge (line row) (rate -0.50, lam 0.15); tilt bound of 6 (rate -1.00, lam 0.00)</text>
<text x="701" y="262" font-size="11" fill="#222">  4 ccw: blocked at first order by wall y=0 of 4 (rate -0.34, lam 0.00); 5's corner on 4's edge (line row) (rate -0.48, lam 0.00); tilt bound of 4 (rate -1.00, lam 0.30)</text>
<text x="701" y="278" font-size="11" fill="#222">  4 cw: blocked at first order by 4's corner on 0's edge (rate -1.00, lam 0.00); 0's corner on 4's edge (rate -1.00, lam 0.00); 5's corner on 4's edge (rate -0.52, lam 0.57) ...</text>
<text x="701" y="294" font-size="11" fill="#222">  every direction of the plane is blocked with all rows kept (0 / 72 feasible for S_A, S_B, S_AB): no second-order</text>
<text x="701" y="310" font-size="11" fill="#222">  test applies here -- the contact is torque-locked by 7 (ccw) and by the floor + the tilt bound (cw) on 6,</text>
<text x="701" y="326" font-size="11" fill="#222">  by the wall + tilt bound (ccw) and by 0, 5 (cw) on 4.  A219's strut mode is a rotation of 6 about the</text>
<text x="701" y="342" font-size="11" fill="#222">  7-contact, NOT about P: v2 = +0.381 there, and P then leaves 4 at second order.</text>
<text x="701" y="358" font-size="12" fill="#222"></text>
<text x="701" y="374" font-size="12" fill="#222" font-weight="bold">Curvature of the VV rows along the rolling (the inverted-pendulum terms, Theorem SO):</text>
<text x="701" y="390" font-size="11" fill="#222">  rot 6 about P: y^T H_A y = h_B = n_e.(c_6 - P) = 0.7044, y^T H_B y = 1/2;  rot 4: y^T H_B y = h_A = 0.7044, y^T H_A y = 1/2</text>
<text x="701" y="406" font-size="11" fill="#222">  contribution to y^T Hess(L) y: -lam_A h_B - lam_B / 2 &lt; 0 whenever loaded -- a knife-edge IF the rolling were feasible.</text>
<text x="60" y="701" font-size="12" fill="#222" font-weight="bold">inset: feasible relative translations u of 6's vertex at P</text>
<text x="60" y="717" font-size="11" fill="#222">feasible iff n_e.u &gt;= 0 (orange half-plane) or n_f.u &lt;= 0 (blue); the excluded wedge (hatched) is</text>
