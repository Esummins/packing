<text x="30.00" y="24.00" font-size="11.0" fill="#111" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="bold">(A) a type-F corner: own incidences 4 of 6</text>
<text x="20.00" y="326.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">delta = 0.60, theta = 25 deg, partner in mode (a): x_v = sin theta, y_v = 1 - (delta - sin theta) tan theta</text>
<text x="20.00" y="337.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">A meets ['BL00', 'BL10'], B meets ['BL00', 'BL01']: each slot has ONE own meeter [T, rule E]</text>
<text x="20.00" y="349.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">B's leftmost vertex at height 1.824 &gt; 1; its part below v = 1 has u &lt;= delta = 0.60</text>
<text x="20.00" y="360.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">c10's second meeter lives in the red strip (1+delta, 2) x (0, 1): a jut or the BR flat meeter</text>
<text x="20.00" y="372.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">c01's second meeter: TL's meeter reaching y &lt; 2, or a free square above B's edge (notch)</text>
<text x="20.00" y="383.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">check: pair gap 0 (contact) (B rests on A's corner), quadrant gap 0 (contact), B's top at 2.246 &gt;= 2 (R' = 1.246 &gt;= 1)</text>
