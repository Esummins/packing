<text x="320.00" y="326.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">two disjoint squares both meeting c00, c01, c10: their separating line meets all three</text>
<text x="320.00" y="337.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">cells, so it DESCENDS (u0, v0 &gt; 0) and crosses the box iff 1/u0 + 1/v0 &gt; 1 (here 1.176)</text>
<text x="320.00" y="349.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">the lower square sits in the triangle; its largest inscribed square has side</text>
<text x="320.00" y="360.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">u0 v0 / (u0 + v0) = 0.850 &lt; 1 (SQUARE-IN-TRIANGLE, any tilt) -- contradiction [T]</text>
