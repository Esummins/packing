<text x="1316.0" y="392.4" font-size="10.5" fill="#2d3748">IS: the window of half-width 0.19 around the lowest vertex of F (1.7934,</text>
<text x="1316.0" y="405.4" font-size="10.5" fill="#2d3748">0.9680), magnified 10x.</text>
<text x="1316.0" y="418.4" font-size="10.5" fill="#2d3748">The long dashed grey lines are the slot boundaries (depth 1 and the ends</text>
<text x="1316.0" y="431.4" font-size="10.5" fill="#2d3748">of L = [1,2], R = [s-2, s-1]); the stippled band is the ribbon.</text>
<text x="1316.0" y="444.4" font-size="10.5" fill="#2d3748">F shares area 2.1e-03 with slot L and 2.1e-04 with slot R -- the whole</text>
<text x="1316.0" y="457.4" font-size="10.5" fill="#2d3748">family-stuck property of the nine squares hangs on these two slivers.</text>
</svg>