<text x="33.62" y="47.62" font-size="11.0" fill="#222" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">(a) the wall x = 0 and its middle notch</text>
<polygon points="53.76,292.96 131.34,272.82 111.20,195.24 33.62,215.38" fill="#dfe8fb" fill-opacity="0.60" stroke="#3b6fd6" stroke-width="1.3"/>
<polygon points="109.47,364.38 187.05,344.24 166.91,266.66 89.33,286.80" fill="#fbe3e3" fill-opacity="0.60" stroke="#d63b3b" stroke-width="1.3"/>
<polygon points="266.80,308.67 246.67,231.09 324.26,210.96 344.38,288.55" fill="#dfe8fb" fill-opacity="0.60" stroke="#3b6fd6" stroke-width="1.3"/>
<polygon points="195.38,364.38 175.25,286.80 252.84,266.67 272.96,344.26" fill="#fbe3e3" fill-opacity="0.60" stroke="#d63b3b" stroke-width="1.3"/>
<polygon points="324.24,125.04 246.66,145.18 266.80,222.76 344.38,202.62" fill="#dfe8fb" fill-opacity="0.60" stroke="#3b6fd6" stroke-width="1.3"/>
<polygon points="268.53,53.62 190.95,73.76 211.09,151.34 288.67,131.20" fill="#fbe3e3" fill-opacity="0.60" stroke="#d63b3b" stroke-width="1.3"/>
<polygon points="111.20,109.33 131.33,186.91 53.74,207.04 33.62,129.45" fill="#dfe8fb" fill-opacity="0.60" stroke="#3b6fd6" stroke-width="1.3"/>
<polygon points="182.62,53.62 202.75,131.20 125.16,151.33 105.04,73.74" fill="#fbe3e3" fill-opacity="0.60" stroke="#d63b3b" stroke-width="1.3"/>
<polyline points="33.62,215.38 33.62,129.45 54.50,209.96 33.62,215.38" fill="none" stroke="#e08a1e" stroke-width="1.60"/>
<text x="24.00" y="386.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">B: theta 14.55 deg, delta 0.891; B': theta 75.46 deg, delta 0.695</text>
<text x="24.00" y="397.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">base h = 1.0721, triangle inradius 0.1174 &lt; 1/2 (Lemma MID-NOTCH)</text>
<text x="24.00" y="409.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">g(theta) + g(theta') = 6.6923 &gt; 2 (4 - s) = 0.2458: the notch holds no disc of radius 1/2</text>
<text x="24.00" y="420.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">check: h &lt; 4 - s + sin + sin' = 1.3422 (all-ADJ)</text>
<text x="390.00" y="70.00" font-size="11.0" fill="#111" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="bold">Lemma MID-NOTCH</text>
<text x="390.00" y="88.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">g(t) = (1 + sin t)/cos t - 2 sin t</text>
<text x="390.00" y="99.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">min g = 0.72355 at t = 26.261 deg</text>
<text x="390.00" y="111.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">a disc of radius 1/2 in the middle notch needs</text>
<text x="390.00" y="122.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">  g(t) + g(t') &lt; 2 (4 - s) &lt;= 0.36</text>
<text x="390.00" y="134.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">but g + g' &gt;= 1.44711: dead for every s &gt; 3.27645</text>
<text x="390.00" y="145.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal"></text>
<text x="390.00" y="157.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">robust form (separation margin 1/(2 sqrt2)):</text>
<text x="390.00" y="168.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">  g2(t) = tan t / 2 + sec t / (2 sqrt2) - sin t</text>
<text x="390.00" y="180.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">  min g2 = 0.19658 at 28.904 deg =&gt; dead for s &gt; 3.80342</text>
<text x="390.00" y="191.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">  the window [3.82, 4) clears it by 0.0166</text>
<text x="390.00" y="203.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal"></text>
<text x="390.00" y="214.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">consequence: no unit square of the pocket has its</text>
<text x="390.00" y="226.00" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">INSCRIBED DISC in a wall notch -- A249's poking</text>
<text x="390.00" y="237.50" font-size="9.2" fill="#333" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="normal">square enters the notch with a CORNER only.</text>
<text x="24.00" y="26.00" font-size="12.0" fill="#111" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif" font-weight="bold">A251 -- Lemma MID-NOTCH: the middle notch of a wall of an all-ADJ ring holds no disc of radius 1/2</text>
</svg>
