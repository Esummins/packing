"/><text x="548.0" y="398.0" font-size="10" text-anchor="middle">BR(0,1)</text><polygon points="40.0,190.0 190.0,190.0 190.0,40.0 40.0,40.0" fill="#36c" fill-opacity="0.30" stroke="#36c" stroke-width="1.2"/><text x="115.0" y="115.0" font-size="10" text-anchor="middle">TL(0,0)</text><polygon points="473.0,190.0 623.0,190.0 623.0,40.0 473.0,40.0" fill="#36c" fill-opacity="0.30" stroke="#36c" stroke-width="1.2"/><text x="548.0" y="115.0" font-size="10" text-anchor="middle">TR(0,0)</text><polygon points="40.0,621.6 190.0,621.6 190.0,471.6 40.0,471.6" fill="none" stroke="#080" stroke-width="1.3" stroke-dasharray="5,3"/><polygon points="40.0,471.6 190.0,471.6 190.0,321.6 40.0,321.6" fill="none" stroke="#080" stroke-width="1.3" stroke-dasharray="5,3"/><polygon points="40.0,190.0 190.0,190.0 190.0,40.0 40.0,40.0" fill="none" stroke="#080" stroke-width="1.3" stroke-dasharray="5,3"/><polygon points="190.0,621.6 340.0,621.6 340.0,471.6 190.0,471.6" fill="none" stroke="#080" stroke-width="1.3" stroke-dasharray="5,3"/><polygon points="344.9,621.6 494.9,621.6 494.9,471.6 344.9,471.6" fill="none" stroke="#080" stroke-width="1.3" stroke-dasharray="5,3"/><polygon points="471.6,190.0 621.6,190.0 621.6,40.0 471.6,40.0" fill="none" stroke="#080" stroke-width="1.3" stroke-dasharray="5,3"/><polygon points="410.2,400.0 524.8,496.8 621.6,382.2 507.0,285.4" fill="none" stroke="#080" stroke-width="1.3" stroke-dasharray="5,3"/><polygon points="228.3,377.2 342.9,474.0 439.6,359.4 325.0,262.6" fill="none" stroke="#080" stroke-width="1.3" stroke-dasharray="5,3"/><polygon points="125.1,266.8 239.7,363.6 336.5,249.0 221.9,152.2" fill="none" stroke="#080" stroke-width="1.3" stroke-dasharray="5,3"/><polygon points="327.9,265.0 442.5,361.8 539.3,247.2 424.7,150.4" fill="none" stroke="#080" stroke-width="1.3" stroke-dasharray="5,3"/><polygon points="224.8,154.6 339.4,251.4 436.2,136.8 321.6,40.0" fill="none" stroke="#080" stroke-width="1.3" stroke-dasharray="5,3"/><text x="40.0" y="639.0" font-size="11">A111 T1: S02's load path IS Trump's load path (D4 element diag). Solid = S02 at side 3.886746 (red f1 f2 f3 = load-bearing, grey f0 = strut, blue = slot squares).</text><text x="40.0" y="654.0" font-size="11">Dashed = Trump at s-hat = 3.877084 under diag. The three matched centres differ by <= 0.0175 (inf-norm) and the tilts by 1.383 deg (48.4351 vs 90 - 40.1819 = 49.8181).</text><text x="40.0" y="669.0" font-size="11">So boxes of radius (r >= 0.0175, rho >= 1.383 deg) on the load path alone hold a Trump image: the branch cannot be about the load path.</text><text x="40.0" y="684.0" font-size="11">What separates the two grains is the SLOT skeleton -- S02 carries BR(0,1) and TL(0,0), this Trump image carries BL(2,0) and TR(0,0) instead -- and the class pins.</text><text x="40.0" y="699.0" font-size="11">Geometry check: S02 worst pair SAT -2.9e-07 / worst wall -3.0e-07; Trump image -2.0e-15 / -6.1e-16.</text></svg>