<text x="24.0" y="562.0" font-size="10" fill="#111" text-anchor="start" font-weight="bold">THE ROW. For any line l inside [0,s0]^2 the chords l n Q of a packing are pairwise interior-disjoint sub-intervals of a segment of length s0, so SUM |l n Q| &lt;= s0. Splitting off the hypothesis squares gives the LP row over the 5 free placements: SUM_p</text>
<text x="24.0" y="575.4" font-size="10" fill="#111" text-anchor="start" font-weight="bold">|l n Q_p| x_p &lt;= s0 - SUM_pins |l n P| - minchord(H, l) = 1.877084.</text>
<text x="24.0" y="593.8" font-size="9.5" fill="#222" text-anchor="start">THE VIOLATION. On this line the stored dual support charges 2.005508 against a right-hand side of 1.877084: a violation of +0.128424. The four chords are 1.000000 (pin P2)) + 1.005508 (LP column)) + 1.000000 (H (conditioned))) + 1.000000 (LP column)) = 4.005508, and</text>
<text x="24.0" y="606.7" font-size="9.5" fill="#222" text-anchor="start">the container is only 3.877084 wide. That is the PI's reading: a line crossing four squares through opposing sides forces side &gt;= 4.</text>
<text x="24.0" y="624.6" font-size="9.5" fill="#222" text-anchor="start">THE TERMS. minchord(H, l) = 1.000000 exactly, by the two-endpoint argument of guardline.minchord_box (V = 0.249757, terms {'A(t0)': 1.008928580551734, 'A(t1)': 1.0, 'B(y(t0))': 2.3728281330070358, 'B(y(t1))': inf}); the cheap alternative |l n K'(B)| = 0.831256 is</text>
<text x="24.0" y="637.5" font-size="9.5" fill="#222" text-anchor="start">weaker, so the row uses minchord(H). 1 pin chord(s) are exactly 1 (the line runs through the pin core's height range at every position of the pin box); the other 4 pins do not meet l. a_stock = 0.356602, a_exact = 0.395283 (A135), K'(B) has 40 certified vertices,</text>
<text x="24.0" y="650.4" font-size="9.5" fill="#222" text-anchor="start">area 0.681579.</text>
<text x="24.0" y="668.3" font-size="9.0" fill="#555" text-anchor="start">LEGEND — BODIES are filled; CORES are solid outlines with no fill; SCHEMATIC objects (the centre box) are thin dashed with no fill. Grey P0..P4 = the pins at their box centres, thin dark blue = A135's exact pin core; bright cyan H = the conditioned square at the mid tilt, faint</text>
<text x="24.0" y="680.7" font-size="9.0" fill="#555" text-anchor="start">cyan = the two extremal tilts, filled purple = A132's certified polygon core K'(B), black dashed = the centre box; orange-scale = the LP dual support by weight. HEAVY RED DASHED = the guard line; the thick coloured segments on it are the chords, each labelled with its length.</text>
